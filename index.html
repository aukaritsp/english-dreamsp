 {id:"D102", set:"B", part:1, img:"bus", ch:["People are getting off a bus.","Some people are waiting at a bus stop.","A bus is parked in a garage.","The bench is being painted."], a:1, type:"Part I Photographs",
  ex:"ภาพมีป้ายรถเมล์และคนยืนรอ แต่ไม่มีรถบัส ตัวเลือก A และ C จึงผิด ส่วน D “is being painted” ต้องมีคนกำลังทาสี"},
 {id:"D103", set:"B", part:1, img:"shelf", ch:["She is reading a newspaper.","She is putting a book on a shelf.","She is sitting at a table.","The shelves are empty."], a:1, type:"Part I Photographs",
  ex:"เธอเอื้อมมือวางหนังสือบนชั้น ตัวเลือก D ผิดเพราะชั้นมีหนังสือเต็ม"},
 {id:"D104", set:"B", part:1, img:"bikes", ch:["Some bicycles are parked in a row.","A man is riding a bicycle.","The bicycles are being repaired.","A tree is being cut down."], a:0, type:"Part I Photographs",
  ex:"ภาพไม่มีคน ตัวเลือกที่มีคนทำกิจกรรม (B) หรือ “are being + V3” (C, D) จึงผิด"},
 {id:"D105", set:"B", part:1, img:"phone", ch:["He is talking on the phone.","He is hanging a picture.","He is packing a suitcase.","He is turning on a lamp."], a:0, type:"Part I Photographs",
  ex:"เขาถือโทรศัพท์แนบหู มีโคมไฟในภาพแต่เขาไม่ได้กำลังเปิด (D) ระวังสิ่งของในภาพที่ใช้เป็นกับดัก"},
 {id:"D201", set:"B", part:2, script:[["W","Where is the nearest post office?"]], ch:["It’s two blocks down this street.","I posted it yesterday.","At nine o’clock.","Yes, it’s near."], a:0, type:"Part II Question–Response",
  ex:"Where ต้องตอบสถานที่ B เล่นคำ post / posted และคำถาม Wh- ตอบ Yes ไม่ได้"},
 {id:"D202", set:"B", part:2, script:[["M","When will the new manager start?"]], ch:["At the head office.","Starting from scratch.","On the first of next month.","She’s very experienced."], a:2, type:"Part II Question–Response",
  ex:"When ต้องตอบเวลา B ใช้คำ start ซ้ำเป็นกับดัก"},
 {id:"D203", set:"B", part:2, script:[["W","Why is the office so cold today?"]], ch:["The heater is broken.","I caught a cold.","It’s on the fifth floor.","Today is Monday."], a:0, type:"Part II Question–Response",
  ex:"Why ต้องตอบเหตุผล B ใช้ cold คนละความหมาย (เป็นหวัด)"},
 {id:"D204", set:"B", part:2, script:[["M","Who’s going to pick up the clients from the airport?"]], ch:["Around noon.","I think Ken volunteered.","At Terminal 2.","Pick any one you like."], a:1, type:"Part II Question–Response",
  ex:"Who ต้องตอบเป็นคน คำตอบแบบ “I think…” ก็ถูกได้ D ใช้ pick ซ้ำ"},
 {id:"D205", set:"B", part:2, script:[["W","How long does it take to get to the factory?"]], ch:["It’s a long building.","About forty minutes by car.","Yes, I took it.","The factory makes shoes."], a:1, type:"Part II Question–Response",
  ex:"How long ถามระยะเวลา A ใช้ long ในความหมายความยาว"},
 {id:"D206", set:"B", part:2, script:[["M","Should I print the agenda or email it?"]], ch:["Email is fine.","Yes, you should.","It’s on the agenda.","The printer is new."], a:0, type:"Part II Question–Response",
  ex:"คำถาม A or B ต้องเลือกอย่างหนึ่ง ตอบ Yes ไม่ได้"},
 {id:"D207", set:"B", part:2, script:[["W","Could you check these figures for me?"]], ch:["They’re in good shape.","Of course. Leave them on my desk.","I paid by check.","She’s a figure skater."], a:1, type:"Part II Question–Response",
  ex:"Could you…? เป็นคำขอร้อง ตอบรับแล้วบอกให้ทำอะไรต่อ C และ D เล่นเสียง check / figure"},
 {id:"D208", set:"B", part:2, script:[["M","Didn’t you order more paper last week?"]], ch:["Yes, but it hasn’t arrived yet.","The paper is white.","Last week was busy.","I’d like to order the soup."], a:0, type:"Part II Question–Response",
  ex:"คำถามปฏิเสธใช้ยืนยันข้อมูล ตอบ Yes แล้วอธิบายเพิ่มได้ D ใช้ order คนละความหมาย"},
 {id:"D209", set:"B", part:2, script:[["W","What time does the store close today?"]], ch:["At the corner.","It’s a convenience store.","Not until 10 p.m.","Close the door, please."], a:2, type:"Part II Question–Response",
  ex:"What time ถามเวลา “Not until 10 p.m.” = ปิด 4 ทุ่ม D ใช้ close ซ้ำ"},
 {id:"D210", set:"B", part:2, script:[["M","I can’t find my ID card anywhere."]], ch:["Did you check your jacket pocket?","My ID number is 1234.","Anywhere is fine with me.","The card was beautiful."], a:0, type:"Part II Question–Response",
  ex:"โจทย์บอกเล่าปัญหา คำตอบที่ดีคือช่วยแก้ปัญหา ตัวเลือกอื่นใช้คำซ้ำ (ID, anywhere, card)"},
 {id:"D211", set:"B", part:2, script:[["W","Which room is the training in?"]], ch:["Room 305, I believe.","It was a good training.","By train.","Yes, it’s in."], a:0, type:"Part II Question–Response",
  ex:"Which room ต้องตอบห้อง C เล่นเสียง training / train"},
 {id:"D212", set:"B", part:2, script:[["M","Would you mind closing the window?"]], ch:["Not at all.","It’s a nice view.","I don’t mind the rain.","The window is made of glass."], a:0, type:"Part II Question–Response",
  ex:"Would you mind…? ถ้ายินดีทำให้ตอบ Not at all (= ไม่รังเกียจ) ระวังคิดว่าเป็นการปฏิเสธ"},
 {id:"D213", set:"B", part:2, script:[["W","How much is the registration fee?"]], ch:["Registration opens on Monday.","It’s free for members.","About ten people.","Fill in this form."], a:1, type:"Part II Question–Response",
  ex:"How much ถามราคา “free for members” ตอบเรื่องราคาโดยอ้อม C ตอบจำนวนคน (How many)"},
 {id:"D214", set:"B", part:2, script:[["M","Let’s take a short break."]], ch:["Good idea. I need some coffee.","It broke last week.","It’s a short story.","Take the second left."], a:0, type:"Part II Question–Response",
  ex:"Let’s… คือการชวน ตอบรับหรือปฏิเสธ B เล่นเสียง break / broke"},
 {id:"D215", set:"B", part:2, script:[["W","Is the report due today or tomorrow?"]], ch:["Yes, it’s due.","Tomorrow morning.","Every day.","It’s a long report."], a:1, type:"Part II Question–Response",
  ex:"คำถาม A or B ตอบด้วยตัวเลือกหนึ่ง ตอบ Yes ไม่ได้"},
 {id:"D301", set:"B", part:3, script:B_C1, q:"Where does the woman most likely work?", ch:["At a hotel","At a car rental company","At an airline","At a travel agency"], a:1, type:"Part III Short Conversations",
  ex:"ผู้ชายขอเช่ารถ และผู้หญิงพูดถึงรถที่ว่างและสาขาที่คืนรถ = บริษัทรถเช่า ระวัง airport ที่ทำให้นึกถึงสายการบิน"},
 {id:"D302", set:"B", part:3, script:B_C1, q:"Why can the man get a mid-size car for the same price?", ch:["He is a regular customer","There is a weekend promotion","The small cars are damaged","He booked online"], a:1, type:"Part III Short Conversations",
  ex:"“at the same price because of our weekend promotion” ฟังคำว่า because"},
 {id:"D303", set:"B", part:3, script:B_C1, q:"What will the man have to pay extra for?", ch:["Insurance","Fuel","Returning the car to another branch","Renting for an extra day"], a:2, type:"Part III Short Conversations",
  ex:"ค่าธรรมเนียม 300 บาทสำหรับการคืนรถคนละสาขา (a different location = another branch)"},
 {id:"D304", set:"B", part:3, script:B_C2, q:"What are the speakers discussing?", ch:["A new parking rule","A building renovation","A visitor’s schedule","A traffic accident"], a:0, type:"Part III Short Conversations",
  ex:"หัวข้อบอกในประโยคแรก: the email about the new parking rules"},
 {id:"D305", set:"B", part:3, script:B_C2, q:"Who will be able to park on the ground floor?", ch:["Managers","All staff","Visitors","Delivery drivers"], a:2, type:"Part III Short Conversations",
  ex:"“The ground floor will be reserved for visitors.” พนักงานต้องจอดชั้นใต้ดิน"},
 {id:"D306", set:"B", part:3, script:B_C2, q:"Why is the man concerned?", ch:["He has not read the email","The basement entrance is often crowded","Parking fees will increase","He does not have a car"], a:1, type:"Part III Short Conversations",
  ex:"“There’s always a long line at the basement entrance.” = มักแออัด จึงทำให้ตอนเช้าช้าลง"},
 {id:"D307", set:"B", part:3, script:B_C3, q:"Why is the woman calling?", ch:["To make a reservation","To order a birthday cake","To cancel a booking","To ask for directions"], a:0, type:"Part III Short Conversations",
  ex:"“I’d like to book a table” = จองโต๊ะ เค้กเป็นกับดักจากคำว่า birthday"},
 {id:"D308", set:"B", part:3, script:B_C3, q:"What problem does the man mention?", ch:["The restaurant is closed on Saturday","The requested time is not available","The private room is too small","The price has gone up"], a:1, type:"Part III Short Conversations",
  ex:"“we’re fully booked at seven” = เวลาที่ขอไม่ว่าง"},
 {id:"D309", set:"B", part:3, script:B_C3, q:"What does the woman decide to do?", ch:["Choose another restaurant","Book a table for Sunday","Take the private room at a later time","Reduce the number of guests"], a:2, type:"Part III Short Conversations",
  ex:"เธอบอกว่าดึกไปหน่อยแต่ห้องส่วนตัวดีมาก “I’ll take it.” = เลือกห้องส่วนตัวเวลา 2 ทุ่มครึ่ง"},
 {id:"D310", set:"B", part:3, script:B_C4, q:"What position has the man applied for?", ch:["Sales","Marketing","Logistics","Design"], a:1, type:"Part III Short Conversations",
  ex:"“a second interview for the marketing position” ระวัง Logistics ซึ่งเป็นชื่อบริษัท"},
 {id:"D311", set:"B", part:3, script:B_C4, q:"Who will the man meet on Wednesday?", ch:["The company president","The marketing director","Another applicant","A human resources assistant"], a:1, type:"Part III Short Conversations",
  ex:"“You’ll meet our marketing director”"},
 {id:"D312", set:"B", part:3, script:B_C4, q:"What does the woman ask the man to bring?", ch:["A reference letter","His ID card","Examples of his work","A copy of his contract"], a:2, type:"Part III Short Conversations",
  ex:"“bring some samples of your previous work” = ตัวอย่างผลงาน และผู้ชายตอบว่าจะนำ portfolio มา"},
 {id:"D313", set:"B", part:3, script:B_C5, q:"What problem are the speakers discussing?", ch:["A printer is not working","A handbook has errors","The copy center is closed","A technician is late"], a:0, type:"Part III Short Conversations",
  ex:"“The printer on our floor has stopped working again.”"},
 {id:"D314", set:"B", part:3, script:B_C5, q:"When will the replacement part arrive?", ch:["Today","Tomorrow","On Wednesday","On Thursday"], a:3, type:"Part III Short Conversations",
  ex:"“won’t arrive until Thursday” ระวัง tomorrow ซึ่งเป็นเส้นตายของการพิมพ์"},
 {id:"D315", set:"B", part:3, script:B_C5, q:"What does the woman suggest?", ch:["Asking for more time","Using the copy center","Buying a new printer","Sending the file by email"], a:1, type:"Part III Short Conversations",
  ex:"“Why don’t you use the copy center…?” = คำแนะนำ"},
 {id:"D401", set:"B", part:4, script:B_T1, q:"Why is the speaker calling?", ch:["To confirm a payment","To reschedule an appointment","To introduce a new dentist","To give test results"], a:1, type:"Part IV Short Talks",
  ex:"“We need to change your appointment” = เลื่อนนัด"},
 {id:"D402", set:"B", part:4, script:B_T1, q:"Why is Dr. Lee unavailable on Tuesday?", ch:["She is on vacation","She is sick","She is attending a conference","She is moving to a new clinic"], a:2, type:"Part IV Short Talks",
  ex:"“because Dr. Lee will be attending a conference”"},
 {id:"D403", set:"B", part:4, script:B_T1, q:"What is Mr. Brown asked to do?", ch:["Call back to choose a time","Come in on Tuesday","Send an email","Pay a deposit"], a:0, type:"Part IV Short Talks",
  ex:"คำขออยู่ท้ายข้อความเสียง: call us back to tell us which time is better"},
 {id:"D404", set:"B", part:4, script:B_T2, q:"Where is the announcement most likely being made?", ch:["At an airport","In a shopping mall","At a train station","In a hotel"], a:1, type:"Part IV Short Talks",
  ex:"คำบอกสถานที่: shoppers, third floor, information desk, City Mall"},
 {id:"D405", set:"B", part:4, script:B_T2, q:"How long will the jacket sale last?", ch:["Thirty minutes","One hour","All day","Three days"], a:0, type:"Part IV Short Talks",
  ex:"“For the next thirty minutes only” ข้อแบบนี้ต้องจดตัวเลขขณะฟัง"},
 {id:"D406", set:"B", part:4, script:B_T2, q:"How can shoppers get a free umbrella?", ch:["By buying a winter jacket","By joining a membership program","By spending more than 2,000 baht","By visiting the third floor"], a:2, type:"Part IV Short Talks",
  ex:"“customers who spend more than two thousand baht today will receive a free umbrella”"},
 {id:"D407", set:"B", part:4, script:B_T3, q:"What has caused the problem on Rama Four Road?", ch:["An accident","Road construction","Flooding from heavy rain","A broken traffic light"], a:2, type:"Part IV Short Talks",
  ex:"“Heavy rain overnight has caused flooding”"},
 {id:"D408", set:"B", part:4, script:B_T3, q:"What are drivers advised to do?", ch:["Stay at home","Use the expressway","Take public transportation","Drive slowly"], a:1, type:"Part IV Short Talks",
  ex:"“Drivers heading downtown should use the expressway instead.” should = คำแนะนำ"},
 {id:"D409", set:"B", part:4, script:B_T3, q:"When is the road expected to reopen?", ch:["At seven o’clock","By noon","This afternoon","Tomorrow morning"], a:2, type:"Part IV Short Talks",
  ex:"ฝนหยุดตอนเที่ยง (noon) แต่ถนนเปิดตอนบ่าย ข้อนี้มีสองเวลาให้สับสน ต้องฟังให้ตรงคำถาม"},
 {id:"D410", set:"B", part:4, script:B_T4, q:"Who most likely are the listeners?", ch:["New employees","Customers","Team leaders","IT technicians"], a:0, type:"Part IV Short Talks",
  ex:"“Welcome to your first day” = พนักงานใหม่"},
 {id:"D411", set:"B", part:4, script:B_T4, q:"What will the listeners do after lunch?", ch:["Receive their laptops","Meet their team leaders","Take a product test","Tour the factory"], a:1, type:"Part IV Short Talks",
  ex:"“After lunch… each of you will meet your team leader.” ตัวเลือก A เกิดตอนเช้า"},
 {id:"D412", set:"B", part:4, script:B_T4, q:"How long will the product training last?", ch:["One morning","One day","Two days","Five days"], a:2, type:"Part IV Short Talks",
  ex:"“a two-day product training course”"},
 {id:"D413", set:"B", part:4, script:B_T5, q:"What is being advertised?", ch:["A cooking school","A restaurant","A meal kit delivery service","A kitchen appliance"], a:2, type:"Part IV Short Talks",
  ex:"“delivers healthy meal kits right to your door”"},
 {id:"D414", set:"B", part:4, script:B_T5, q:"What is said about the recipes?", ch:["They are quick to prepare","They are vegetarian","They come from famous chefs","They change every day"], a:0, type:"Part IV Short Talks",
  ex:"“take less than thirty minutes to cook” = ทำได้เร็ว"},
 {id:"D415", set:"B", part:4, script:B_T5, q:"What special offer is mentioned?", ch:["Free delivery","A free recipe book","Half price on the first box","A discount for members"], a:2, type:"Part IV Short Talks",
  ex:"“get your first box at half price”"}

 ,{id:"E101", set:"C", part:1, img:"board", ch:["A woman is erasing the whiteboard.","One of the people is writing on a board.","The chairs are stacked against the wall.","Some people are rearranging the furniture."], a:1, type:"Part I Photographs",
  ex:"ภาพที่มีหลายคน คำตอบมักใช้ “One of the people…” ผู้หญิงกำลังเขียน ไม่ใช่ลบ (erasing) ส่วนคนอื่นนั่งอยู่ ไม่ได้ย้ายเฟอร์นิเจอร์"},
 {id:"E102", set:"C", part:1, img:"stairs", ch:["A railing runs alongside the stairs.","Someone is climbing the stairs.","A plant is being watered.","The steps are being swept."], a:0, type:"Part I Photographs",
  ex:"ภาพไม่มีคน คำตอบที่ถูกบรรยายสภาพ (runs alongside = อยู่ตามแนว) ส่วน “is being + V3” ต้องมีคนกำลังทำ จึงผิด"},
 {id:"E103", set:"C", part:1, img:"pier", ch:["Boats are sailing in open water.","Some boats are tied up at a pier.","People are fishing from a bridge.","A boat is being lifted out of the water."], a:1, type:"Part I Photographs",
  ex:"เรือผูกเชือกไว้กับท่า (tied up at a pier) ไม่ได้แล่นอยู่กลางน้ำ ศัพท์ pier, dock, moored พบบ่อยใน Part I ระดับยาก"},
 {id:"E104", set:"C", part:1, img:"shop", ch:["The customer is paying with a card.","A bag is being handed across the counter.","The woman is stocking the shelves.","They are waiting in line."], a:1, type:"Part I Photographs",
  ex:"ทั้งสองคนยื่นมือส่งถุงข้ามเคาน์เตอร์ ภาพไม่ได้แสดงบัตร (A) ระวังตัวเลือกที่ “น่าจะเกิดขึ้น” ในร้านค้าแต่ไม่เห็นในภาพ"},
 {id:"E105", set:"C", part:1, img:"ladder", ch:["A man is replacing a light fixture.","A man is leaning a ladder against a wall.","A man is painting the ceiling.","Some tools have been left on the floor."], a:0, type:"Part I Photographs",
  ex:"เขายืนบนบันไดยื่นมือไปที่โคมไฟ ไม่มีแปรงทาสี (C) และไม่มีเครื่องมือบนพื้น (D) บันไดตั้งอยู่เอง ไม่ได้พิงกำแพง (B)"},
 {id:"E201", set:"C", part:2, script:[["W","Do you know when the shipment from Osaka is supposed to arrive?"]], ch:["Let me check the tracking number.","It’s shipping from Osaka.","Yes, I knew it.","It arrived by sea last year."], a:0, type:"Part II Question–Response",
  ex:"คำตอบอ้อมว่าจะไปตรวจสอบให้ ถูกบ่อยในระดับยาก คำถาม Do you know when… ไม่จำเป็นต้องตอบ Yes/No"},
 {id:"E202", set:"C", part:2, script:[["M","Shouldn’t we have heard back from the client by now?"]], ch:["They said it might take until Friday.","I heard it from the back.","The client’s office is downtown.","Yes, we should hear it."], a:0, type:"Part II Question–Response",
  ex:"ผู้พูดสงสัยว่าทำไมลูกค้ายังไม่ตอบ คำตอบอธิบายว่าลูกค้าบอกว่าอาจถึงศุกร์ ตัวเลือก B และ D เล่นคำ heard / back"},
 {id:"E203", set:"C", part:2, script:[["W","Why don’t you ask Jason to take over the presentation?"]], ch:["Because he presented last week.","He’s already got too much on his plate.","Yes, it was over.","The presentation room is booked."], a:1, type:"Part II Question–Response",
  ex:"Why don’t you…? คือคำแนะนำ ตอบปฏิเสธอ้อมด้วยสำนวน too much on his plate = งานล้นมือ ตัวเลือกที่ขึ้นด้วย Because เป็นกับดัก"},
 {id:"E204", set:"C", part:2, script:[["M","Who approved the overtime for the weekend shift?"]], ch:["It was approved yesterday.","Probably the plant manager.","About ten extra hours.","I’ll work this weekend."], a:1, type:"Part II Question–Response",
  ex:"Who ต้องตอบเป็นคน A ตอบ when ส่วน C ตอบ how much"},
 {id:"E205", set:"C", part:2, script:[["W","The quarterly figures look much better than we expected."]], ch:["The new marketing campaign must have paid off.","I expect so, too.","They’re on page four.","Four times a year."], a:0, type:"Part II Question–Response",
  ex:"ประโยคบอกเล่า คำตอบที่เหมาะคือแสดงความเห็นต่อ paid off = ได้ผล B ใช้ expect ซ้ำ D เล่นกับ quarterly"},
 {id:"E206", set:"C", part:2, script:[["M","Would you rather meet in person or set up a video call?"]], ch:["Whatever works best for your schedule.","I’d rather not say.","The video was very clear.","Yes, let’s set it up."], a:0, type:"Part II Question–Response",
  ex:"คำถาม A or B ตอบแบบ “แล้วแต่คุณ” ได้ ตอบ Yes ไม่ได้ B ใช้ would rather ซ้ำ"},
 {id:"E207", set:"C", part:2, script:[["W","How come the elevator’s out of service again?"]], ch:["About twice a month.","Maintenance is replacing a cable.","Take the stairs to the third floor.","It came in yesterday."], a:1, type:"Part II Question–Response",
  ex:"How come = Why ต้องตอบเหตุผล A ตอบ how often C เป็นคำแนะนำที่ไม่ได้ตอบคำถาม"},
 {id:"E208", set:"C", part:2, script:[["M","I thought the conference had been postponed."]], ch:["Only the evening dinner was.","I’ll post it online.","The conference room is free.","It’s in the main hall."], a:0, type:"Part II Question–Response",
  ex:"แก้ความเข้าใจผิด: เลื่อนเฉพาะงานเลี้ยงตอนเย็น (was = was postponed) B เล่นเสียง postponed / post"},
 {id:"E209", set:"C", part:2, script:[["W","Isn’t Ms. Novak supposed to be leading this workshop?"]], ch:["Her flight was delayed, so Mr. Diaz is filling in.","Yes, she led it.","It’s a three-hour workshop.","She’s supposed to call."], a:0, type:"Part II Question–Response",
  ex:"ตอบด้วยเหตุผลว่าทำไมเธอไม่อยู่ และใครมาแทน (filling in = ทำหน้าที่แทน)"},
 {id:"E210", set:"C", part:2, script:[["M","Where can I find last year’s audit report?"]], ch:["It should be in the shared drive, in the finance folder.","Last year, I think.","The auditors arrived on Monday.","It’s a detailed report."], a:0, type:"Part II Question–Response",
  ex:"Where ต้องตอบตำแหน่ง ซึ่งอาจเป็นโฟลเดอร์ในคอมพิวเตอร์ ไม่จำเป็นต้องเป็นสถานที่จริง"},
 {id:"E211", set:"C", part:2, script:[["W","Can you have the revised contract on my desk by noon?"]], ch:["I’ll do my best, but legal hasn’t finished reviewing it.","No, I don’t have a desk.","It’s about ten pages.","Noon is fine for lunch."], a:0, type:"Part II Question–Response",
  ex:"ตอบรับแบบมีเงื่อนไข เป็นคำตอบที่สมจริงที่สุด ตัวเลือกอื่นใช้คำซ้ำ (desk, noon)"},
 {id:"E212", set:"C", part:2, script:[["M","We’re running low on printer toner."]], ch:["I placed an order this morning.","The printer is on the second floor.","It’s running smoothly.","He’s a fast runner."], a:0, type:"Part II Question–Response",
  ex:"แจ้งปัญหา คำตอบบอกว่าสั่งแล้ว C และ D เล่นคำ running / runner"},
 {id:"E213", set:"C", part:2, script:[["W","Which supplier did you end up going with?"]], ch:["We’re still comparing quotes.","At the end of the month.","I went with my colleague.","They supply office furniture."], a:0, type:"Part II Question–Response",
  ex:"ยังไม่ได้เลือก จึงตอบว่ากำลังเทียบราคา go with = เลือก ตัวเลือก C ใช้ went with ในความหมาย “ไปกับ”"},
 {id:"E214", set:"C", part:2, script:[["M","Hasn’t the budget proposal been submitted yet?"]], ch:["The director wants a few more changes.","Yes, it’s a proposal.","Submit it to the bank.","The budget is tight."], a:0, type:"Part II Question–Response",

CR: [
 {id:"C501", part:5, q:"All employees are required to ______ their identification badges at all times.", ch:["wear","wearing","wore","worn"], a:0, type:"Part V Sentence Completion",

 ,{id:"E501", set:"C", part:5, q:"Had the shipment been dispatched on time, the client ______ the order.", ch:["would not cancel","would not have cancelled","will not cancel","had not cancelled"], a:1, type:"Part V Sentence Completion",
  ex:"Had + S + V3 คือ If แบบที่ 3 ที่ละ If แล้วสลับที่ (inversion) ประโยคหลักจึงเป็น would (not) have + V3"},
 {id:"E502", set:"C", part:5, q:"Not until the final report was released ______ the extent of the losses.", ch:["the investors realized","did the investors realize","the investors did realize","investors realizing"], a:1, type:"Part V Sentence Completion",
  ex:"ขึ้นต้นด้วย Not until … ประโยคหลักต้องสลับเป็นรูปคำถาม (did + S + V1)"},
 {id:"E503", set:"C", part:5, q:"The new regulations require that every employee ______ safety training once a year.", ch:["completes","complete","completed","will complete"], a:1, type:"Part V Sentence Completion",
  ex:"require / insist / recommend that + S + V1 (subjunctive) แม้ประธานเอกพจน์ก็ไม่เติม s"},
 {id:"E504", set:"C", part:5, q:"The board’s decision to relocate the headquarters was met with ______ resistance from staff.", ch:["considerable","considerate","consideration","considerably"], a:0, type:"Part V Sentence Completion",
  ex:"considerable = มาก (ขยายคำนาม) ส่วน considerate = ใส่ใจผู้อื่น เป็นกับดักคำหน้าตาคล้าย"},
 {id:"E505", set:"C", part:5, q:"Ms. Adeyemi was promoted ______ her outstanding contribution to the merger negotiations.", ch:["in recognition of","in spite of","on behalf of","in addition"], a:0, type:"Part V Sentence Completion",
  ex:"in recognition of = เพื่อเป็นการยกย่อง ตัวเลือก D ขาด to จึงตามด้วยคำนามไม่ได้"},
 {id:"E506", set:"C", part:5, q:"______ the delays in production, the product launch went ahead as planned.", ch:["Notwithstanding","Whereas","Provided that","Unless"], a:0, type:"Part V Sentence Completion",
  ex:"Notwithstanding = แม้ว่า ใช้เป็นบุพบทตามด้วยคำนามได้ ตัวเลือกอื่นต้องตามด้วยประโยค"},
 {id:"E507", set:"C", part:5, q:"The firm is seeking candidates ______ experience lies in international tax law.", ch:["who","whose","whom","which"], a:1, type:"Part V Sentence Completion",
  ex:"ประสบการณ์ “ของ” ผู้สมัคร → whose + คำนาม"},
 {id:"E508", set:"C", part:5, q:"Sales figures for the third quarter were ______ higher than analysts had predicted.", ch:["markedly","marked","marking","markedness"], a:0, type:"Part V Sentence Completion",
  ex:"ขยายคำคุณศัพท์ higher ต้องใช้ adverb → markedly (อย่างเห็นได้ชัด)"},
 {id:"E509", set:"C", part:5, q:"Customers who have not yet received a refund are asked to contact us ______.", ch:["accordingly","promptly","prompt","promptness"], a:1, type:"Part V Sentence Completion",
  ex:"ขยายกริยา contact → promptly (โดยเร็ว) accordingly แปลว่า “ตามนั้น” ไม่เข้ากับบริบท"},
 {id:"E510", set:"C", part:5, q:"The contract will be renewed automatically ______ either party gives written notice.", ch:["unless","despite","whether","so that"], a:0, type:"Part V Sentence Completion",
  ex:"unless = เว้นแต่ ต่ออายุอัตโนมัติ “เว้นแต่” จะแจ้งเป็นลายลักษณ์อักษร"},
 {id:"E511", set:"C", part:5, q:"By the time the auditors arrive next week, the accounting team ______ all the documents.", ch:["will review","reviews","will have reviewed","has reviewed"], a:2, type:"Part V Sentence Completion",
  ex:"By the time + อนาคต → Future Perfect (will have + V3) งานจะเสร็จก่อนเวลานั้น"},
 {id:"E512", set:"C", part:5, q:"The proposal was rejected on the ______ that it lacked sufficient financial detail.", ch:["grounds","purpose","account","behalf"], a:0, type:"Part V Sentence Completion",
  ex:"on the grounds that = ด้วยเหตุผลที่ว่า เป็นวลีตายตัว"},
 {id:"E513", set:"C", part:5, q:"Only employees with security clearance are ______ to enter the server room.", ch:["authorized","authoritative","authority","authorizing"], a:0, type:"Part V Sentence Completion",
  ex:"be authorized to + V = ได้รับอนุญาต authoritative แปลว่าน่าเชื่อถือ/มีอำนาจ"},
 {id:"E514", set:"C", part:5, q:"The CEO’s speech, ______ was broadcast live, focused on sustainability.", ch:["that","which","what","who"], a:1, type:"Part V Sentence Completion",
  ex:"หลังจุลภาค (non-defining clause) ใช้ that ไม่ได้ สิ่งของ → which"},
 {id:"E515", set:"C", part:5, q:"Profits have risen steadily, ______ the company plans to expand into Vietnam.", ch:["consequently","as a result of","hence","so"], a:3, type:"Part V Sentence Completion",
  ex:"เชื่อมสองประโยคด้วยจุลภาคต้องใช้คำสันธาน so ส่วน consequently และ hence เป็นกริยาวิเศษณ์ ต้องใช้อัฒภาค (;) หรือขึ้นประโยคใหม่"},
 {id:"E516", set:"C", part:5, q:"The committee has yet ______ a final decision on the budget.", ch:["reaching","to reach","reached","reach"], a:1, type:"Part V Sentence Completion",
  ex:"have yet to + V1 = ยังไม่ได้… (ความหมายปฏิเสธโดยไม่มี not)"},
 {id:"E517", set:"C", part:5, q:"The marketing campaign proved ______ more effective than the previous one.", ch:["far","very","too","so"], a:0, type:"Part V Sentence Completion",
  ex:"ขยายขั้นกว่าใช้ far / much / considerably ห้ามใช้ very หรือ too กับ more"},
 {id:"E518", set:"C", part:5, q:"Ms. Torres is widely regarded ______ one of the most innovative designers in the industry.", ch:["as","to","like","for"], a:0, type:"Part V Sentence Completion",
  ex:"be regarded as = ได้รับการยอมรับว่าเป็น เป็นวลีตายตัว"},
 {id:"E519", set:"C", part:5, q:"Applicants are expected to be ______ in at least two Asian languages.", ch:["fluent","fluency","fluently","fluid"], a:0, type:"Part V Sentence Completion",
  ex:"be + adjective + in → fluent in (คล่อง)"},
 {id:"E520", set:"C", part:5, q:"So successful ______ that the company decided to extend it for another month.", ch:["the promotion was","was the promotion","the promotion has been","promotion was"], a:1, type:"Part V Sentence Completion",
  ex:"ขึ้นต้นด้วย So + adjective ต้องสลับกริยาไว้หน้าประธาน (inversion) → So successful was the promotion that…"},
 {id:"E601", set:"C", part:6, p:"travelpolicy", q:"Choose the best answer for blank (1).", ch:["reimbursed","reimbursing","reimbursement","reimburse"], a:0, type:"Part VI Text Completion",
  ex:"การจองจะ “ไม่ได้รับ” การเบิกเงินคืน → will no longer be + V3"},
 {id:"E602", set:"C", part:6, p:"travelpolicy", q:"Choose the best sentence for blank (2).", ch:["We understand that this change may require some adjustment.","Our office will be closed on public holidays.","Several employees were promoted last quarter.","The cafeteria menu will change next week."], a:0, type:"Part VI Text Completion",
  ex:"ประโยคต้องต่อจากการประกาศกฎใหม่ และนำไปสู่คำอธิบายข้อดีของระบบ ตัวเลือกอื่นไม่เกี่ยว"},
 {id:"E603", set:"C", part:6, p:"travelpolicy", q:"Choose the best answer for blank (3).", ch:["which","that","what","it"], a:0, type:"Part VI Text Completion",
  ex:"หลังจุลภาค ขยายใจความทั้งประโยคก่อนหน้า → which (that ใช้หลังจุลภาคไม่ได้ ส่วน it ทำให้เกิด comma splice)"},
 {id:"E604", set:"C", part:6, p:"bags", q:"Choose the best answer for blank (1).", ch:["which","who","where","whose"], a:0, type:"Part VI Text Completion",
  ex:"แทน reusable ones (สิ่งของ) และเป็นกรรมของ sell → which"},
 {id:"E605", set:"C", part:6, p:"bags", q:"Choose the best answer for blank (2).", ch:["where","which","that","when"], a:0, type:"Part VI Text Completion",
  ex:"ประโยคตามหลังสมบูรณ์แล้ว (plastic bag use fell…) จึงต้องใช้ relative adverb where = “ที่สาขาเหล่านั้น”"},
 {id:"E606", set:"C", part:6, p:"bags", q:"Choose the best sentence for blank (3).", ch:["Shoppers at the pilot branches responded more positively than the company had expected.","The chain was founded in 1985.","Plastic is made from oil.","Many supermarkets sell fresh fruit."], a:0, type:"Part VI Text Completion",
  ex:"ต้องเชื่อมผลของโครงการนำร่องกับประโยคถัดไปที่ว่าเชนอื่นจะทำตาม"},
 {id:"E701", set:"C", part:7, p:"retreat", q:"What is the main purpose of the email?", ch:["To request a deposit","To confirm arrangements and point out a possible issue","To cancel an outdoor activity","To offer a discount on a future event"], a:1, type:"Part VII Single Passages",
  ex:"ย่อหน้าแรกบอกชัด: to confirm the final arrangements and to raise one issue"},
 {id:"E702", set:"C", part:7, p:"retreat", q:"What problem could occur if it rains on 14 October?", ch:["The workshops would be canceled","The indoor alternative could not include everyone","The dinner would be moved indoors","An extra fee would be charged"], a:1, type:"Part VII Single Passages",
  ex:"คลาสทำอาหารรับได้ 25 คน แต่กลุ่มมี 35 คน D ผิดเพราะไม่มีค่าใช้จ่ายเพิ่ม"},
 {id:"E703", set:"C", part:7, p:"retreat", q:"By what date should Mr. Grant confirm the final number of guests?", ch:["1 October","4 October","10 October","14 October"], a:1, type:"Part VII Single Passages",
  ex:"ต้องคำนวณ: แจ้ง 10 วันก่อนมาถึง (14 ต.ค.) = 4 ต.ค."},
 {id:"E704", set:"C", part:7, p:"retreat", fixed:true, q:"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? “Could you let me know which members of your team would join the class in that case?”", ch:["[1]","[2]","[3]","[4]"], a:2, type:"Part VII Single Passages",
  ex:"“the class” และ “in that case” อ้างถึงคลาสทำอาหารกรณีฝนตก ซึ่งพูดถึงก่อนตำแหน่ง [3] พอดี ข้อแทรกประโยคต้องหาคำอ้างอิงที่เชื่อมกัน"},
 {id:"E705", set:"C", part:7, p:"fourday", q:"What is the article mainly about?", ch:["A new law on working hours","The results of a trial of a shorter work week","Problems in the restaurant industry","A study on employee sick days"], a:1, type:"Part VII Single Passages",
  ex:"หัวข้อข่าวและย่อหน้าแรกบอกใจความหลัก ตัวเลือก C และ D เป็นรายละเอียดย่อย"},
 {id:"E706", set:"C", part:7, p:"fourday", q:"What benefit was reported by companies that will continue the shorter week?", ch:["Higher prices for customers","Fewer employees leaving","Lower salaries","More meetings"], a:1, type:"Part VII Single Passages",
  ex:"lower staff turnover = พนักงานลาออกน้อยลง ต้องรู้ศัพท์ turnover ในบริบทงานบุคคล"},
 {id:"E707", set:"C", part:7, p:"fourday", q:"Why did some companies withdraw from the trial?", ch:["Their employees disliked the schedule","They could not keep service levels without extra staff","They lost money on the program fees","The organizers asked them to leave"], a:1, type:"Part VII Single Passages",
  ex:"“unable to maintain service levels without hiring additional staff, which offset any savings”"},
 {id:"E708", set:"C", part:7, p:"fourday", q:"What does Dr. Prasert suggest about the trial’s results?", ch:["They prove the shorter week works for all businesses","They may not apply to typical companies","They should become national policy immediately","They were analyzed incorrectly"], a:1, type:"Part VII Single Passages",
  ex:"บริษัทที่อาสาเข้าร่วมมักมีวัฒนธรรมยืดหยุ่นอยู่แล้ว จึงอาจไม่เป็นตัวแทนบริษัททั่วไป ข้อแนวนี้ต้องอนุมาน"},
 {id:"E709", set:"C", part:7, p:"cowork", q:"What change will affect Flex members?", ch:["Their monthly fee will rise","They will get more meeting-room hours","They will need approval for all bookings","They can no longer bring guests"], a:1, type:"Part VII Single Passages",
  ex:"เพิ่มจาก 5 เป็น 10 ชั่วโมง ส่วนการขออนุมัติใช้กับ Dedicated Desk และค่าที่ขึ้นคือ day pass"},
 {id:"E710", set:"C", part:7, p:"cowork", q:"What is indicated about unused meeting-room hours?", ch:["They can be transferred to another member","They expire at the end of each month","They are refunded","They can be used by guests"], a:1, type:"Part VII Single Passages",
  ex:"“cannot be carried over to the following month” = หมดอายุสิ้นเดือน"},
 {id:"E711", set:"C", part:7, p:"cowork", q:"A Dedicated Desk member wants to bring two guests on one visit. What will happen?", ch:["Both guests can enter free of charge","One of the guests must buy a day pass","Both guests must buy day passes","The front desk must approve the visit"], a:1, type:"Part VII Single Passages",
  ex:"สมาชิกทุกคนพาแขกฟรีได้ 1 คน คนที่สองต้องซื้อ day pass ข้อแบบนี้ต้องนำกฎมาใช้กับสถานการณ์"},
 {id:"E712", set:"C", part:7, p:"lumen", q:"What is NOT mentioned as a responsibility of the position?", ch:["Setting sales targets","Building relationships with hospitals","Reporting to a director","Designing medical devices"], a:3, type:"Part VII Single Passages",
  ex:"ตัดสิ่งที่เจอในย่อหน้าแรกทีละข้อ การออกแบบอุปกรณ์ไม่ได้กล่าวถึง"},
 {id:"E713", set:"C", part:7, p:"lumen", q:"What is a requirement for the position?", ch:["A background in healthcare","Knowledge of Vietnamese","At least three years in a management role","Living in Singapore"], a:2, type:"Part VII Single Passages",
  ex:"แยก “ต้องมี” กับ “ถ้ามีจะดี”: healthcare เป็น strongly preferred และภาษาเวียดนามเป็น advantage ไม่ใช่ข้อบังคับ"},
 {id:"E714", set:"C", part:7, p:"lumen", q:"What should applicants include in their cover letter?", ch:["Their salary expectations","Evidence of meeting sales targets","A list of hospitals they have visited","Their travel availability"], a:1, type:"Part VII Single Passages",
  ex:"“a cover letter describing your record of meeting sales targets”"},
 {id:"E801", set:"C", part:8, p:"packright", q:"Why did Ms. Mendes write to Mr. Wiriya?", ch:["To apologize for a late delivery","To inform him of upcoming price increases","To introduce a new product","To request payment"], a:1, type:"Part VIII Double Passages",
  ex:"อีเมลแรกแจ้งการขึ้นราคาบรรจุภัณฑ์กระดาษ"},
 {id:"E802", set:"C", part:8, p:"packright", q:"What is most likely true about Mr. Wiriya’s order of paper bags?", ch:["It qualifies for the current price","It was placed after the deadline for the special offer","It is too small for the special offer","It will be delivered in May"], a:1, type:"Part VIII Double Passages",
  ex:"ต้องใช้สองอีเมล: ข้อเสนอต้องสั่งก่อน 20 พ.ค. แต่เขาตอบวันที่ 22 พ.ค. จำนวน 60,000 ชิ้นเกินขั้นต่ำแล้ว ปัญหาจึงอยู่ที่วันที่"},
 {id:"E803", set:"C", part:8, p:"packright", q:"Why did Mr. Wiriya respond late?", ch:["He was on vacation","He was attending an event abroad","He was waiting for a budget decision","He did not receive the first email"], a:1, type:"Part VIII Double Passages",
  ex:"a trade fair in Germany = งานแสดงสินค้าต่างประเทศ"},
 {id:"E804", set:"C", part:8, p:"packright", q:"What is most likely true about the trays for the July order?", ch:["They will cost 8 percent more","They will be charged at the current price","They are no longer available","They must be ordered with the paper bags"], a:1, type:"Part VIII Double Passages",
  ex:"ถาดย่อยสลายได้จะขึ้นราคาตั้งแต่ 1 ก.ย. คำสั่งเดือนกรกฎาคมจึงยังเป็นราคาเดิม ต้องเชื่อมวันที่สองจุด"},
 {id:"E805", set:"C", part:8, p:"packright", q:"In the second email, the word “spread” is closest in meaning to", ch:["divide","cover","increase","advertise"], a:0, type:"Part VIII Double Passages",
  ex:"spread the order across two deliveries = แบ่งคำสั่งซื้อเป็นสองรอบ"},
 {id:"E806", set:"C", part:8, p:"writing", q:"Why does Krit believe he can take Course B without Course A?", ch:["He has relevant work experience","His company is a partner","He has taken Course C","The prerequisite has been removed"], a:0, type:"Part VIII Double Passages",
  ex:"ประกาศระบุว่าใช้ Course A หรือ “ประสบการณ์เทียบเท่า” ได้ และ Krit เขียนรายงานมาสามปี"},
 {id:"E807", set:"C", part:8, p:"writing", q:"If Krit takes Course C, how much will he most likely pay?", ch:["6,200 baht","5,800 baht","5,270 baht","4,930 baht"], a:2, type:"Part VIII Double Passages",
  ex:"6,200 ลด 15% สำหรับบริษัทพันธมิตร = 5,270 บาท ตัวเลือก D คือราคา Course B หลังลด เป็นกับดัก"},
 {id:"E808", set:"C", part:8, p:"writing", q:"Why can Krit not attend the beginning of Course B?", ch:["He has a regular commitment on Wednesday evenings","He works on Saturdays","He registered too late","The course is full"], a:0, type:"Part VIII Double Passages",
  ex:"Course B เรียนวันพุธเย็น และเขามี standing commitment วันพุธเย็นถึงกลางมีนาคม"},
 {id:"E809", set:"C", part:8, p:"writing", q:"What will Krit most likely do if he cannot join Course B late?", ch:["Take Course A first","Wait for the next term","Enroll in the Saturday course","Ask for a refund"], a:2, type:"Part VIII Double Passages",
  ex:"“I will take the weekend course instead” ประกาศบอกว่า Course C เรียนวันเสาร์ ต้องเชื่อมสองบท"},
 {id:"E810", set:"C", part:8, p:"writing", q:"What is indicated about Krit’s email?", ch:["It was sent after registration closed","It was sent before the registration deadline","It was sent to Delta Engineering","It includes payment details"], a:1, type:"Part VIII Double Passages",

W: [
 {id:"W1", parts:["The number of students who apply to the program ",["have","A"]," ",["increased","B"]," ",["significantly","C"]," ",["over","D"]," the past decade."], a:0, type:"Subject–verb agreement",
  ex:"The number of + นามพหูพจน์ ใช้กริยาเอกพจน์ → has increased (ต่างจาก A number of students ที่ใช้พหูพจน์)"},
 {id:"W2", parts:["Neither the manager nor the employees ",["was","A"]," informed ",["about","B"]," the change ",["until","C"]," it ",["had been announced","D"],"."], a:0, type:"Subject–verb agreement",
  ex:"Neither…nor / Either…or ให้กริยาผันตามประธานตัวที่อยู่ใกล้ (the employees) → were"},
 {id:"W3", parts:["She enjoys ",["reading","A"],", ",["to swim","B"],", and ",["hiking","C"]," ",["during","D"]," the summer."], a:1, type:"Parallel structure",
  ex:"สิ่งที่อยู่ในรายการเดียวกันต้องรูปแบบเดียวกัน reading, swimming, hiking (และ enjoy + V-ing)"},
 {id:"W4", parts:["The results of the experiment were ",["surprising","A"]," ",["different","B"]," from ",["what","C"]," the researchers ",["had expected","D"],"."], a:0, type:"Word form",
  ex:"คำที่ขยายคุณศัพท์ (different) ต้องเป็นกริยาวิเศษณ์ → surprisingly different"},
 {id:"W5", parts:[["Since","A"]," 2015, the city ",["builds","B"]," more than twenty ",["new","C"]," parks ",["for","D"]," its residents."], a:1, type:"Tense",
  ex:"Since + จุดเวลาในอดีต → Present Perfect: has built"},
 {id:"W6", parts:["Each of the participants ",["were","A"]," asked ",["to complete","B"]," a questionnaire ",["before","C"]," ",["leaving","D"],"."], a:0, type:"Subject–verb agreement",
  ex:"Each of + นามพหูพจน์ ประธานจริงคือ Each (เอกพจน์) → was asked ตัดส่วน of the participants ออกจะเห็นชัด"},
 {id:"W7", parts:["The professor, ",["which","A"]," has taught at the university ",["for","B"]," thirty years, ",["is","C"]," retiring ",["next","D"]," month."], a:0, type:"Relative pronoun",
  ex:"ขยายคน ใช้ who ไม่ใช่ which"},
 {id:"W8", parts:["Many scientists believe ",["that","A"]," climate change is ",["more serious","B"]," ",["than","C"]," any ",["another","D"]," environmental problem."], a:3, type:"Comparison",
  ex:"โครงสร้างเปรียบเทียบกับสมาชิกกลุ่มเดียวกัน: than any other + นามเอกพจน์"},
 {id:"W9", parts:["The committee ",["has","A"]," decided to postpone ",["the","B"]," meeting ",["because","C"]," ",["the","D"]," bad weather."], a:2, type:"Conjunction vs preposition",
  ex:"because + ประโยค (ประธาน+กริยา) / because of + คำนาม ตรงนี้ตามด้วยนามวลี the bad weather → because of"},
 {id:"W10", parts:[["Despite of","A"]," the heavy traffic, she ",["arrived","B"]," at the airport ",["in","C"]," time ",["to catch","D"]," her flight."], a:0, type:"Preposition",

/* balance where the correct answer sits in the CULI set (1–4 about equally often), stable across visits */
function balanceSet(items0, seed){
  const rnd = ()=>{ seed = (seed*1103515245 + 12345) % 2147483648; return seed/2147483648; };
  const items = items0.slice().sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  const targets = []; while(targets.length<items.length) targets.push(0,1,2,3);
  for(let i=targets.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [targets[i],targets[j]]=[targets[j],targets[i]]; }
  items.forEach((q,n)=>{
    if(q.fixed) return; // options with a natural order ([1]–[4]) stay as written
    const t = targets[n], others = [0,1,2,3].filter(j=>j!==q.a);
    const pos = []; pos[q.a]=t; const free=[0,1,2,3].filter(x=>x!==t); others.forEach((j,m)=>pos[j]=free[m]);
    const ch=[]; q.ch.forEach((c,j)=>ch[pos[j]]=c); q.ch=ch;
    q.ex = q.ex.replace(/A or B/g,"\u0000").replace(/(^|[^A-Za-z])([A-D])(?![A-Za-z])/g,(m0,pre,L,off,str)=>pre+(/(ตัวเลือก|\(|และ|หรือ|,)\s*$/.test(str.slice(0,off+pre.length))?"":"ตัวเลือก ")+(pos["ABCD".indexOf(L)]+1)).replace(/\u0000/g,"A or B");
    q.a = t;
  });
}

/* ---------- storage (one record per player name on this device) ---------- */
const KEY = "cutep-prep-v1";
const lsGet = k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
const pkey = n => KEY+":"+n.trim().toLowerCase();
let player = lsGet("cutep-player") || "";
function players(){ try{ const l=JSON.parse(lsGet("cutep-players")); return Array.isArray(l)?l:[]; }catch(e){ return []; } }
function blank(){ return {stats:{L:{c:0,t:0},R:{c:0,t:0},W:{c:0,t:0}}, wrong:[], examDate:"", known:[]}; }
function fix(st){ ["L","R","W","CL","CR"].forEach(k=>{ if(!st.stats[k]) st.stats[k]={c:0,t:0}; }); if(!st.exam) st.exam="cutep"; if(!st.dates) st.dates={}; if(!Array.isArray(st.history)) st.history=[]; if(!Array.isArray(st.thistory)) st.thistory=[]; if(!Array.isArray(st.wrong)) st.wrong=[]; if(!Array.isArray(st.known)) st.known=[]; return st; }
function loadFor(n){ try{ const s=JSON.parse(lsGet(pkey(n))); if(s && s.stats) return fix(s); }catch(e){} return fix(blank()); }
function load(){ return player ? loadFor(player) : blank(); }
function save(){ if(player) lsSet(pkey(player), JSON.stringify(S)); }
let S = fix(load());
const EX = ()=>EXAMS[S.exam];
function prune(){ S.wrong = S.wrong.filter(id=>findItem(id)[1]); }
const wrongHere = ()=>S.wrong.filter(id=>EX().secs.includes(findItem(id)[0]));
function cleanName(n){ return String(n||"").replace(/\s+/g," ").trim().slice(0,30); }
function setPlayer(name){
  name = cleanName(name); if(!name) return false;
  // first name ever entered keeps the progress made before names existed
  if(!lsGet(pkey(name)) && lsGet(KEY) && !lsGet("cutep-migrated")){ lsSet(pkey(name), lsGet(KEY)); lsSet("cutep-migrated","1"); }
  player = name; lsSet("cutep-player", name);
  const list = players().filter(n=>n.toLowerCase()!==name.toLowerCase()); list.unshift(name);
  lsSet("cutep-players", JSON.stringify(list.slice(0,30)));
  S = fix(load()); prune(); sess=null; deck=[]; save(); pushOnline();
  return true;
}

function ask(msg, yes){
  return new Promise(res=>{
    const m=$("#modal"); $("#modal-msg").textContent=msg; $("#modal-yes").textContent=yes||"ตกลง"; m.hidden=false;
    const done=v=>{ m.hidden=true; $("#modal-yes").onclick=$("#modal-no").onclick=null; res(v); };
    $("#modal-yes").onclick=()=>done(true); $("#modal-no").onclick=()=>done(false);
    $("#modal-yes").focus();
  });

let rate = (()=>{ try{ const r=parseFloat(localStorage.getItem("cutep-rate")); return r>0?r:0.75; }catch(e){ return 0.75; } })();
let voices = [], speakTimer = null, speakToken = 0;
function loadVoices(){ try{ voices = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
// higher-quality voices sound much clearer: prefer enhanced/premium/natural/neural/Google, US or UK
function quality(v){ let q=0; const n=v.name;
  if(/premium|enhanced|natural|neural|online/i.test(n)) q+=4;
  if(/google/i.test(n)) q+=3;
  if(/^en[-_](US|GB)/i.test(v.lang)) q+=2;
  if(v.localService===false) q+=1;
  if(/compact|novelty|whisper|bells|bubbles|bad news|boing|cellos|organ|trinoids|zarvox|jester|superstar|wobble|albert|bahh/i.test(n)) q-=10;
  return q; }
function pickVoice(sp){
  if(!voices.length) return null;
  const ranked = voices.slice().sort((a,b)=>quality(b)-quality(a));
  const fem = /female|samantha|zira|jenny|aria|karen|moira|tessa|serena|ava|allison|susan|libby|sonia|emma|google us english$/i;
  const mal = /\bmale|daniel|david|guy|alex|fred|tom|aaron|arthur|ryan|evan|google uk english male/i;
  const female = ranked.find(v=>fem.test(v.name) && !/\bmale/i.test(v.name.replace(/female/i,"")));
  const male = ranked.find(v=>mal.test(v.name) && !/female/i.test(v.name));
  if(sp==="W") return female || ranked[0];
  if(sp==="M") return male || ranked.find(v=>v!==female) || ranked[0];
  return male || female || ranked[0];
}
let speakHook = null, startGuard = null;
const canSpeak = ()=> "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance === "function";
// speak line by line with a short pause in between, so each sentence and each choice is easy to separate.
// The first utterance is started inside the tap itself (iOS only allows audio that starts from a tap).
function speak(lines, onEnd){
  const hook = speakHook;
  if(!canSpeak()){ hook ? hook("unsupported") : toast("เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน"); return; }
  const synth = window.speechSynthesis;
  const busy = synth.speaking || synth.pending;
  speakToken++; clearTimeout(speakTimer); clearTimeout(startGuard);
  if(busy){ try{ synth.cancel(); }catch(e){} }
  lines = lines.flatMap(([sp,txt])=> txt.length>110 ? (txt.match(/[^.!?]+[.!?]+["”’]?\s*|[^.!?]+$/g)||[txt]).map(t=>[sp,t.trim()]).filter(x=>x[1]) : [[sp,txt]]);
  const token = speakToken;
  const gap = Math.round(450 / Math.min(1, rate));
  let started = false;
  const next = i=>{
    if(token!==speakToken) return;
    if(i>=lines.length){ hook && hook("end"); onEnd && onEnd(); return; }
    const [sp,txt] = lines[i];
    const u = new SpeechSynthesisUtterance(txt);
    u.lang="en-US"; u.rate=rate; u.volume=1;
    const v=pickVoice(sp); if(v){ u.voice=v; u.lang=v.lang; }
    u.pitch = sp==="W" ? 1.05 : sp==="N" ? 1 : 0.95;
    let moved=false;
    const go=()=>{ if(moved) return; moved=true; clearTimeout(guard); speakTimer = setTimeout(()=>next(i+1), gap); };
    const guard = setTimeout(()=>{ if(token===speakToken){ go(); } }, 5000 + txt.length*110/rate);
    u.onstart = ()=>{ if(!started){ started=true; clearTimeout(startGuard); hook && hook("start"); } };
    u.onend = go; u.onerror = go;
    try{ synth.resume(); }catch(e){}
    synth.speak(u);
  };
  if(busy) speakTimer = setTimeout(()=>next(0), 150); else next(0);
  hook && hook("loading");
  startGuard = setTimeout(()=>{ if(token===speakToken && !started && !synth.speaking){ hook ? hook("fail") : toast("ไม่ได้ยินเสียง? ตรวจระดับเสียงหรือโหมดเงียบ"); } }, 3500);
}
function stopSpeak(){
  speakToken++; clearTimeout(speakTimer); clearTimeout(startGuard);
  try{ if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); }catch(e){}
}
function setRate(r){ rate=r; try{ localStorage.setItem("cutep-rate", String(r)); }catch(e){} }

const speedBtns = ()=> SPEEDS.map(([r,l])=>`<button class="speed" data-r="${r}" aria-pressed="${rate===r}">${l}</button>`).join("");
function bindSpeed(){ document.querySelectorAll(".speed[data-r]").forEach(b=>b.onclick=()=>{ setRate(+b.dataset.r); document.querySelectorAll(".speed[data-r]").forEach(x=>x.setAttribute("aria-pressed", x===b)); toast("ความเร็ว: "+b.textContent); }); }

function speakWord(w, ex){ speak(ex ? [["W",w],["W",ex]] : [["W",w]]); }

function ordered(list, k){ // keep shared passages/scripts together, groups shuffled, parts ascending
  const groups = {};
  list.forEach(q=>{ const g = q.p || (q.script && q.script.length>1 ? JSON.stringify(q.script[0]) : (q.script && (q.part===3||q.part===4) ? JSON.stringify(q.script[0]) : q.id)); (groups[g]=groups[g]||[]).push(q); });
  let gs = shuffle(Object.values(groups));
  gs.forEach(g=>g.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true})));
  if(k==="R") gs.sort((a,b)=>(a[0].p?1:0)-(b[0].p?1:0));
  gs.sort((a,b)=>(a[0].part||0)-(b[0].part||0));
  return gs.flat();
}

const esc = t => String(t==null?"":t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nkey = n => "p_" + Array.from(n.toLowerCase()).map(c=>c.codePointAt(0).toString(36)).join("-").slice(0,120);
function entryFor(st, name){
  const h = st.history||[];
  const best = h.reduce((b,x)=>(!b || x.score>b.score) ? x : b, null);
  const t = st.stats.CL.t + st.stats.CR.t, c = st.stats.CL.c + st.stats.CR.c;
  return {name, best: best?best.score:null, bestL: best?best.L:null, bestR: best?best.R:null, bestSet: best?best.set:null, bestAt: best?best.at:null,
    attempts: h.length, last: h.length?h[h.length-1].score:null, practiced: t, acc: t?Math.round(c/t*100):null,
    ...(()=>{ const th = st.thistory||[]; const tb = th.reduce((b,x)=>(!b || x.score>b.score) ? x : b, null);
      const tt = st.stats.L.t+st.stats.R.t+st.stats.W.t, tc = st.stats.L.c+st.stats.R.c+st.stats.W.c;
      return {tbest: tb?tb.score:null, tL: tb?tb.L:null, tR: tb?tb.R:null, tW: tb?tb.W:null, tAt: tb?tb.at:null, tAttempts: th.length, tAcc: tt?Math.round(tc/tt*100):null}; })(),
    updatedAt: Date.now()};
}
function localBoard(){ const list = players(); if(player && !list.some(n=>n.toLowerCase()===player.toLowerCase())) list.unshift(player); return list.map(n=>{ const me = n.toLowerCase()===player.toLowerCase(); return {...entryFor(me?S:loadFor(n), n), me}; }); }
const online = {db:null, uid:null, mine:{}, rows:null, status:"loading", canWrite:true};
async function initOnline(){
  const inClaude = window.claude && typeof window.claude.use==="function";
  if(!inClaude){
    if(gasRunOn()) return initRemote("gasRun");
    if(GAS_URL) return initRemote("gasFetch");
    if(supaOn()) return initRemote("supa");
  }
  try{
    if(!window.claude || typeof window.claude.use!=="function") throw new Error("no runtime");
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) throw new Error("no db");
    const uid = await user.id(); if(!uid) throw new Error("no id");
    online.db = db; online.uid = uid;
    const timer = setTimeout(()=>{ if(online.status==="loading"){ online.status="off"; rerenderRank(); } }, 10000);
    try{ const snap = await db.doc("scores/"+uid).get(); if(snap.exists){ online.mine = {...((snap.data()||{}).players||{})}; } }catch(e){}
    db.collection("scores").onSnapshot(qs=>{
      clearTimeout(timer);
      const rows=[];
      qs.docs.forEach(d=>{ const p=((d.data()||{}).players)||{}; Object.values(p).forEach(e=>{ if(e && typeof e.name==="string") rows.push({...e, mine: d.id===uid}); }); });
      online.rows = rows; online.status = "on"; rerenderRank();
    }, ()=>{ clearTimeout(timer); online.status="off"; rerenderRank(); });
    if(player) pushOnline();
  }catch(e){ online.status="off"; rerenderRank(); }
}
/* --- Remote leaderboard backends, used only outside claude.ai --- */
const supaOn = ()=> !!(SUPABASE_URL && SUPABASE_KEY);
function supaHeaders(extra){ const h={apikey:SUPABASE_KEY, "Content-Type":"application/json", ...(extra||{})}; if(/^eyJ/.test(SUPABASE_KEY)) h.Authorization="Bearer "+SUPABASE_KEY; return h; }
const supaBase = ()=> SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/scores";
const gasRunOn = ()=> typeof google!=="undefined" && google.script && google.script.run;
const BACKENDS = {
  supa: {
    list: async()=>{ const r = await fetch(supaBase()+"?select=device,name,entry&order=updated_at.desc&limit=500", {headers:supaHeaders()}); if(!r.ok) throw new Error(r.status); return r.json(); },
    save: async row=>{ const r = await fetch(supaBase()+"?on_conflict=id", {method:"POST", headers:supaHeaders({Prefer:"resolution=merge-duplicates,return=minimal"}), body:JSON.stringify([{...row, updated_at:new Date().toISOString()}])}); if(!r.ok) throw new Error(r.status); }
  },
  gasRun: {
    list: ()=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej).listScores()),
    save: row=>new Promise((res,rej)=>google.script.run.withSuccessHandler(x=>x&&x.ok?res():rej(new Error("save"))).withFailureHandler(rej).saveScore(row))
  },
  gasFetch: {
    list: async()=>{ const r = await fetch(GAS_URL+(GAS_URL.includes("?")?"&":"?")+"api=list"); if(!r.ok) throw new Error(r.status); return r.json(); },
    save: async row=>{ const r = await fetch(GAS_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(row)}); const j = await r.json(); if(!j || !j.ok) throw new Error("save"); }
  }
};
function deviceId(){ let id=lsGet("cutep-device"); if(!id){ id = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); lsSet("cutep-device", id); } return id; }
async function remoteRefresh(){
  try{
    const data = await BACKENDS[online.backend].list(), dev = deviceId();
    online.rows = (Array.isArray(data)?data:[]).filter(x=>x && x.entry && typeof x.name==="string").map(x=>({...x.entry, name:x.name, mine:x.device===dev}));
    online.status="on";
  }catch(e){ if(online.status!=="on") online.status="off"; }
  rerenderRank();
}
async function initRemote(kind){
  online.mode="remote"; online.backend=kind; online.status="loading";
  await remoteRefresh();
  setInterval(()=>{ if(document.visibilityState!=="hidden") remoteRefresh(); }, 30000);
  if(player) pushOnline();
}
async function remotePush(){
  const dev = deviceId();
  try{
    await BACKENDS[online.backend].save({id: dev+":"+nkey(player), device: dev, name: player, entry: entryFor(S, player)});
    online.canWrite = true; remoteRefresh();
  }catch(err){ online.canWrite=false; rerenderRank(); }
}
let pushing=false, pushAgain=false;
async function pushOnline(){
  if(online.mode==="remote"){ if(player) remotePush(); return; }
  if(!online.db || !online.uid || !player || !online.canWrite) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    online.mine[nkey(player)] = entryFor(S, player);
    await online.db.doc("scores/"+online.uid).set({players: {...online.mine}});
  }catch(err){ online.canWrite=false; rerenderRank(); }
  pushing=false;
  if(pushAgain){ pushAgain=false; pushOnline(); }
}

  let lastScore=null, lastRank=0;

  <p class="small muted" style="margin:0 0 10px">${note}</p>

    ${myRank?"":`<p class="small" style="margin:10px 0 0">ยังไม่มีคะแนน ทำ “สอบจำลองเต็มชุด” ในแท็บฝึกทำเพื่อขึ้นตาราง</p>`}</div>
  <h2>อันดับ</h2>
  ${ranked.length?`<div class="panel tblwrap"><table class="tbl rank"><thead><tr><th>#</th><th>ชื่อ</th><th class="num">คะแนน</th>${TE?`<th class="num">L</th><th class="num">R</th><th class="num">W</th>`:`<th class="num">L</th><th class="num">R&amp;W</th>`}<th class="num">ครั้ง</th></tr></thead><tbody>
    ${ranked.map(r=>`<tr class="${r.me?"me":""}"><td class="rk">${medal(r.rk)}</td><td>${esc(r.name)}${r.me?' <span class="tag">คุณ</span>':""}<div class="small muted">${TE?"":`ชุด ${esc(r.bestSet||"-")}${r.bestSet==="C"?" (ยาก)":""}`}${r.acc!=null?`${TE?"":" · "}ฝึกแม่น ${r.acc}%`:""}</div></td><td class="num big">${r.best}</td>${r.cols.map(v=>`<td class="num">${v??"-"}</td>`).join("")}<td class="num">${r.attempts||0}</td></tr>`).join("")}
  </tbody></table></div>`:`<div class="panel small">ยังไม่มีใครสอบจำลองเต็มชุด เป็นคนแรกเลยไหม</div>`}
  ${others.length?`<h2>ยังไม่ได้สอบจำลอง</h2><div class="panel tblwrap"><table class="tbl"><tbody>${others.map(r=>`<tr class="${r.me?"me":""}"><td>${esc(r.name)}${r.me?' <span class="tag">คุณ</span>':""}</td><td class="num small muted">${r.practiced?`ฝึก ${r.practiced} ข้อ · แม่น ${r.acc}%`:"ยังไม่ได้ฝึก"}</td></tr>`).join("")}</tbody></table></div>`:""}
  <h2>ประวัติสอบจำลองของฉัน</h2>
  ${hist.length?`<div class="panel tblwrap"><table class="tbl"><thead><tr><th>วันที่</th>${TE?"":"<th>ชุด</th>"}<th class="num">L</th><th class="num">${TE?"R":"R&amp;W"}</th>${TE?`<th class="num">W</th>`:""}<th class="num">รวม</th></tr></thead><tbody>${hist.map(x=>`<tr><td>${new Date(x.at).toLocaleDateString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</td>${TE?"":`<td>${esc(x.set)}</td>`}<td class="num">${x.L}</td><td class="num">${x.R}</td>${TE?`<td class="num">${x.W}</td>`:""}<td class="num big">${x.score}</td></tr>`).join("")}</tbody></table></div>`:`<p class="small muted">ยังไม่มี</p>`}
  <div class="row" style="margin-top:16px"><button class="btn" id="tomock">สอบจำลองเต็มชุด</button></div>`;
  document.querySelectorAll("[data-scope]").forEach(b=>b.onclick=()=>{ rankScope=b.dataset.scope; rank(); });
  document.querySelectorAll("[data-rexam]").forEach(b=>b.onclick=()=>{ rankExam=b.dataset.rexam; rank(); });
  $("#tomock").onclick=()=>{ const ex = TE?"cutep":"culi"; if(S.exam!==ex){ S.exam=ex; save(); } startSession(TE?"TMOCK":"MOCK"); };
}

/* ---------- name gate ---------- */
function welcome(){
  const list = players();
  app.innerHTML = `<section class="welcome">
    <div class="wl-mark" aria-hidden="true">📝</div>
    <h1>เตรียมสอบ CU-TEP &amp; CULI Test</h1>
    <p class="muted">ใส่ชื่อก่อนเริ่ม ชื่อนี้ใช้เก็บสถิติการฝึกของคุณ และแสดงในตารางอันดับ</p>
    <label for="nm" class="small muted">ชื่อของคุณ</label>
    <div class="row" style="margin-top:6px"><input id="nm" class="name-in" maxlength="30" autocomplete="nickname" placeholder="เช่น มายด์" value="${esc(player)}"><button class="btn" id="go">เริ่มใช้งาน</button></div>
    <p class="small muted" id="nmerr" style="min-height:1.4em;margin-top:6px"></p>
    ${list.length?`<p class="small muted" style="margin:14px 0 6px">ชื่อที่เคยใช้ในเครื่องนี้ แตะเพื่อสลับคน</p><div class="chips">${list.map(n=>`<button class="chip" data-name="${esc(n)}">${esc(n)}${n.toLowerCase()===player.toLowerCase()?" ✓":""}</button>`).join("")}</div>`:""}
    <p class="small muted" style="margin-top:22px">ชื่อจะแสดงให้คนที่เปิดหน้านี้เห็นในตารางอันดับ ใช้ชื่อเล่นได้</p>
  </section>`;
  const go = n=>{ const v=cleanName(n); if(!v){ $("#nmerr").textContent="กรุณาใส่ชื่อ"; $("#nm").focus(); return; } setPlayer(v); toast("สวัสดี "+v); location.hash="#home"; route(); };
  $("#go").onclick=()=>go($("#nm").value);
  $("#nm").onkeydown=e=>{ if(e.key==="Enter") go($("#nm").value); };
  document.querySelectorAll("[data-name]").forEach(b=>b.onclick=()=>go(b.dataset.name));
  if(!player) setTimeout(()=>{ try{ $("#nm").focus(); }catch(e){} }, 50);
}

const VIEWS = {home, practice, tips, words, rank, name: welcome};
function route(){
  const v = (location.hash||"#home").slice(1);
  const view = !player ? "name" : (VIEWS[v] ? v : "home");
  document.body.classList.toggle("gate", view==="name");
  speakHook = null;
  if(view!=="practice"){ clearInterval(timerH); clearInterval(ansTimer); stopSpeak(); }
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.v===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  VIEWS[view]();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
prune();
route();
initOnline();
</script>
