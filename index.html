<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เตรียมสอบ CU-TEP & CULI Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5FA; --surface:#FFFFFF; --ink:#1F1B3D; --muted:#625E80; --line:#DEDBEA;
  --pink:#B83B6E; --pink-soft:#F7E3EC; --ok:#23805F; --ok-soft:#E0F2EA; --bad:#B8373A; --bad-soft:#F8E2E2;
  --L:#3A6FB0; --R:#B83B6E; --W:#7A5BB5; --track:#E9E7F2;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16142A; --surface:#221F3B; --ink:#ECEAF6; --muted:#A7A3C4; --line:#3A365C;
    --pink:#EE7FA9; --pink-soft:#3A2236; --ok:#5CC79E; --ok-soft:#183A2E; --bad:#F08A8C; --bad-soft:#3E2124;
    --L:#7FA9E3; --R:#EE7FA9; --W:#AE95E6; --track:#2D2A4A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16142A; --surface:#221F3B; --ink:#ECEAF6; --muted:#A7A3C4; --line:#3A365C;
  --pink:#EE7FA9; --pink-soft:#3A2236; --ok:#5CC79E; --ok-soft:#183A2E; --bad:#F08A8C; --bad-soft:#3E2124;
  --L:#7FA9E3; --R:#EE7FA9; --W:#AE95E6; --track:#2D2A4A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:640px;margin:0 auto;padding:22px 18px 120px}
h1,h2,h3{line-height:1.3;margin:0}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700;margin-top:28px;margin-bottom:10px}
h3{font-size:1.05rem;font-weight:600;margin-top:18px;margin-bottom:6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.en{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:6px}

.switch{display:inline-flex;background:var(--track);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.switch button{border:none;background:transparent;border-radius:9px;padding:7px 16px;font-weight:600;color:var(--muted)}
.switch button[aria-pressed=true]{background:var(--surface);color:var(--pink);box-shadow:0 1px 2px rgba(31,27,61,.12)}
/* hero score bar */
.hero{padding:6px 0 4px}
.score-num{font-size:3.4rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.score-num small{font-size:1.1rem;font-weight:500;color:var(--muted);letter-spacing:0}
.bar{display:flex;gap:4px;margin:16px 0 8px;height:46px}
.seg{position:relative;background:var(--track);border-radius:8px;overflow:hidden;border:none;padding:0;text-align:left}
.seg .fill{position:absolute;inset:0 auto 0 0;width:0;transition:width .8s ease}
.seg span{position:relative;display:block;padding:4px 8px;font-size:.8rem;font-weight:600;line-height:1.25}
.seg span b{display:block;font-size:.95rem}
.legend{font-size:.8rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.start-list{display:grid;gap:10px;margin-top:10px}
.start{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:14px 16px}
.start strong{display:block;font-size:1.05rem}
.start .muted{font-size:.85rem}
.start .go{margin-left:auto;font-weight:600;color:var(--c);white-space:nowrap}
.btn{background:var(--pink);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:600}
:root[data-theme="dark"] .btn{color:#1A1630}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#1A1630}}
.btn.ghost,:root .btn.ghost{background:transparent;color:var(--ink)!important;border:1px solid var(--line)}
.btn:disabled,:root .btn:disabled{background:var(--track);color:var(--muted)!important;cursor:default}
.audio-msg{flex-basis:100%;font-size:.85rem;border-radius:8px;padding:8px 10px;background:var(--bad-soft);color:var(--ink)}
.play.on{background:var(--pink)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,8,25,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal .box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%}
.modal .box p{margin:0 0 16px}
.modal .row{justify-content:flex-end}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

/* practice */
.q-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:.875rem;color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--pink-soft);color:var(--pink)}
.passage{font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-height:46vh;overflow:auto;margin-bottom:14px}
.passage p{margin:0 0 12px;text-indent:1.4em}
.passage h4{margin:0 0 8px;font-size:1rem;text-indent:0}
.stem{font-size:1.05rem;font-weight:500;margin:6px 0 12px}
.stem.en{font-size:1.1rem;font-weight:400;line-height:1.9}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-family:"Source Serif 4",Georgia,serif;font-size:1rem;line-height:1.5}
.choice .k{font-family:"IBM Plex Sans Thai",sans-serif;font-weight:700;min-width:1.2em;color:var(--muted)}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.u{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.u sub{font-family:"IBM Plex Sans Thai",sans-serif;font-size:.68rem;font-weight:700;color:var(--pink);margin-left:1px}
.explain{margin-top:14px;border-radius:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line)}
.explain.ok{border-left:6px solid var(--ok)}
.explain.no{border-left:6px solid var(--bad)}
.explain .verdict{font-weight:700;margin-bottom:4px}
.audio{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.play{width:52px;height:52px;border-radius:50%;border:none;background:var(--L);color:#fff;font-size:1.3rem;display:grid;place-items:center}
:root[data-theme="dark"] .play{color:#16142A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .play{color:#16142A}}
.speed{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.85rem}
.speed[aria-pressed=true]{background:var(--L);border-color:var(--L);color:var(--surface)}
.transcript{font-family:"Source Serif 4",Georgia,serif;font-size:.98rem;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.transcript div{margin-bottom:4px}
.nav-q{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.timer{font-variant-numeric:tabular-nums}

.photo{margin:0 0 12px}
.parts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.part{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:10px 12px}
.part b{color:var(--c)}
.part small{color:var(--muted);font-size:.75rem}
.mockcard{background:var(--pink-soft);border:1px solid var(--pink);border-radius:16px;padding:16px 18px;margin-bottom:18px}
.mc-kicker{font-size:.8rem;font-weight:700;color:var(--pink);letter-spacing:.02em}
.mc-title{font-size:1.35rem;font-weight:700;margin:2px 0 4px}
.partban{border-left:4px solid var(--pink);background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.ansbar{height:6px;background:var(--track);border-radius:3px;margin-top:6px;overflow:hidden}
.ansbar span{display:block;height:100%;background:var(--pink);width:100%;transition:width .2s linear}
.jump{margin-top:14px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;padding:0 12px 12px}
.jb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-size:.85rem;font-variant-numeric:tabular-nums}
.jb.done{background:var(--ok-soft);border-color:var(--ok)}
.jb.cur{outline:2px solid var(--pink)}
.tag.hard{background:var(--bad-soft);color:var(--bad)}
.choice.sel{border-color:var(--pink);background:var(--pink-soft)}
.play:disabled{opacity:.4;cursor:default}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.barcell{width:28%}
.barcell span{display:block;height:8px;border-radius:4px;min-width:2px}
body.gate nav.tabs{display:none}
.welcome{padding:8vh 0 0;max-width:460px;margin:0 auto}
.wl-mark{font-size:2.6rem;margin-bottom:6px}
.welcome h1{font-size:1.7rem;margin-bottom:8px}
.name-in{flex:1;min-width:0;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.9rem}
.tblwrap{overflow-x:auto;padding:8px 12px}
.tbl th{font-size:.75rem;font-weight:600;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th.num{text-align:right}
.tbl.rank td{vertical-align:top}
.tbl .rk{font-weight:700;width:2.2em}
.tbl .big{font-weight:700;font-size:1.05rem}
.tbl tr.me td{background:var(--pink-soft)}
.me-card{border-left:6px solid var(--pink)}
.hello{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.linkbtn{background:none;border:none;color:var(--pink);font-weight:600;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
/* tips */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
summary{padding:13px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:400}
details[open] summary::after{content:"−"}
details .body{padding:0 16px 14px}
details ul{margin:0;padding-left:1.2em}
details li{margin-bottom:6px}
.check{counter-reset:c;list-style:none;padding:0!important}
.check li{counter-increment:c;padding-left:2.1em;position:relative}
.check li::before{content:counter(c);position:absolute;left:0;top:.1em;width:1.5em;height:1.5em;border-radius:50%;background:var(--W);color:var(--surface);font-size:.78rem;font-weight:700;display:grid;place-items:center}

/* vocab */
.card{perspective:1000px;height:230px;margin:10px 0 14px}
.card-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.face.back{transform:rotateY(180deg)}
.word{font-family:"Source Serif 4",Georgia,serif;font-size:2.1rem;font-weight:600}
.pos{color:var(--muted);font-style:italic;font-family:"Source Serif 4",Georgia,serif}
.th{font-size:1.25rem;font-weight:600;margin-bottom:8px}
.ex{font-family:"Source Serif 4",Georgia,serif;font-style:italic;color:var(--muted)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 10px;font-size:.78rem;color:var(--muted);text-decoration:none;font-weight:500}
nav.tabs a .i{font-size:1.15rem;line-height:1.2}
nav.tabs a[aria-current=page]{color:var(--pink);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
/* =====================================================================
   ตารางอันดับออนไลน์เมื่อเปิดนอก claude.ai (เช่น บน Vercel)

/* ---------- data ---------- */
const PASSAGES = {
  heat: { title: "Urban Heat Islands", paras: [
    "Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. The main cause is the replacement of vegetation with materials such as asphalt and concrete, which absorb sunlight during the day and release it slowly at night. As a result, the difference between urban and rural temperatures is usually greatest after sunset rather than at midday.",
    "The consequences extend beyond discomfort. Higher temperatures increase demand for air conditioning, which in turn raises energy consumption and the emissions that contribute to climate change. Heat also poses serious health risks, particularly for elderly residents and people who work outdoors.",
    "City planners have begun to respond. Some have introduced “cool roofs” coated with reflective paint, while others are expanding parks and planting trees along streets. Trees are especially effective because they provide shade and release water vapor, which cools the surrounding air. However, these measures require long-term investment, and their benefits may not be visible for many years. Critics argue that without stricter building regulations, such efforts will remain too limited to make a significant difference."
  ]},
  recall: { title: "Learning That Lasts", paras: [
    "For decades, students have prepared for exams by rereading their notes and highlighting textbooks. Yet research in cognitive psychology suggests that these familiar strategies are surprisingly inefficient. A more powerful technique is retrieval practice: actively recalling information from memory, for example by answering practice questions or explaining a topic without looking at one’s notes.",
    "In a typical study of this kind, students read a passage and then either reread it or took a short test on it. When tested a few minutes later, the rereading group performed slightly better. A week later, however, the pattern reversed: the students who had been tested remembered considerably more. Researchers believe that the effort of retrieving information strengthens the pathways that allow it to be found again.",
    "Retrieval practice is even more effective when combined with spacing, which means reviewing material over several sessions rather than in one long session. Although cramming the night before an exam may feel productive, much of what is learned this way fades quickly. The difficulty that learners experience when they space and test themselves is not a sign of failure; it is precisely what makes the learning last."
  ]}
};

  "<hr style='border:none;border-top:1px dashed var(--line);margin:14px 0'>",
  "<b>From:</b> Daniel Wong<br><b>To:</b> Kanya Sirisuk<br><b>Date:</b> Monday, 10 March<br><b>Subject:</b> RE: First-aid training",

const T_T1 = [["M","Today I want to look at a puzzle that troubled economists for decades: why did electricity take so long to raise productivity in factories? Electric motors were available in the 1880s, yet productivity in American manufacturing barely changed until the 1920s. The answer seems to lie not in the technology itself but in how factories were organized. Steam-powered factories were built around a single central engine, with power delivered to machines through long shafts and belts. When factory owners first adopted electricity, most simply replaced the steam engine with one large electric motor and left everything else the same. The real gains came only when a new generation of managers realized that each machine could have its own small motor. That allowed them to redesign the entire factory floor around the flow of work rather than the location of the power source. Some economists argue that we may be seeing a similar delay today with artificial intelligence."]];
const T_T2 = [["W","Let’s turn to plants that survive in deserts, where rain may fall only a few times a year. One common strategy is to avoid drought altogether. Many desert annuals spend most of their lives as seeds. When a heavy rain finally arrives, they germinate, flower, and produce new seeds within a few weeks, before the soil dries out again. Interestingly, the seeds of some species contain chemicals that prevent germination after a light shower. Only a substantial rainfall washes these chemicals away, which ensures that the plants don’t start growing when there isn’t enough water to complete their life cycle. A second strategy is to tolerate drought. Cacti, for example, store water in their thick stems and open their pores only at night, when cooler temperatures mean less water is lost. Next week, we’ll look at how agricultural scientists are studying these adaptations in the hope of developing more drought-resistant crops."]];

PASSAGES.t_rail = { title: "Railway Time", paras: [
  "Before the second half of the nineteenth century, time was a local affair. Each town set its clocks by the position of the sun, so that noon occurred when the sun was highest in the sky. Because the earth rotates from west to east, this meant that noon in Bristol arrived roughly ten minutes later than it did in London. For most people, such differences hardly mattered; few traveled far enough or fast enough to notice them.",
  "The spread of the railways changed this. A train leaving London at a certain time might arrive in a town whose clocks were set differently, making timetables confusing and, on lines where trains in both directions shared a single track, dangerous. In 1840, the Great Western Railway began using London time at all its stations, and other companies soon followed. By 1855, the great majority of public clocks in Britain displayed what became known as “railway time.”",
  "The change was not universally welcomed. Some towns refused to abandon local time, and a few public clocks were fitted with two minute hands, one showing local time and the other London time. Critics complained that the railway companies were imposing their own convenience on the public. It was not until 1880 that Parliament made a single standard time legal throughout Great Britain.",
  "A similar process took place in North America, where the problem was even more acute because of the continent’s size. In 1883, the railroads of the United States and Canada introduced a system of time zones, each one hour apart. The following year, an international conference in Washington chose Greenwich, in London, as the starting point for the world’s time zones, a decision that reflected Britain’s dominance in shipping and mapmaking at the time."
]};
PASSAGES.t_citizen = { title: "Citizen Science", paras: [
  "For most of the twentieth century, scientific research was regarded as the work of professionals with specialized training and expensive equipment. In recent decades, however, the boundary between expert and amateur has become increasingly blurred. Through what is known as citizen science, members of the public now contribute to research in fields ranging from astronomy to ecology.",
  "Some projects rely on volunteers to collect data. Every winter, for instance, tens of thousands of birdwatchers in North America count the birds they see on a single day, producing a record of population changes that no research team could gather alone. Other projects ask volunteers to analyze data that has already been collected. In one well-known astronomy project, participants classified the shapes of hundreds of thousands of galaxies from telescope images, a task that computers at the time performed poorly.",
  "Skeptics have questioned whether data gathered by untrained volunteers can be trusted. Studies comparing volunteer and professional observations have produced mixed results: volunteers tend to be highly accurate at simple tasks but less reliable when identification requires subtle judgment. To address this, many projects now show the same item to several volunteers and accept only answers on which most of them agree.",
  "Beyond its contribution to research, citizen science may also have educational benefits. Participants often report a greater understanding of the scientific process and, in some cases, a stronger sense of responsibility for their local environment. Whether these effects last, however, remains an open question, since few studies have followed participants over long periods."
]};
PASSAGES.t_bilingual = { title: "The Bilingual Advantage", paras: [
  "For much of the twentieth century, raising children with two languages was thought to be harmful. Educators warned that bilingual children would become confused and fall behind their monolingual peers. From the 1960s onward, however, studies with more careful methods began to reverse this view, and by the early 2000s a new claim had emerged: that speaking two languages gives the brain a general advantage.",
  "The reasoning behind this “bilingual advantage” was appealing. Because bilinguals must constantly suppress one language while using the other, researchers proposed that they develop stronger executive functions, the mental skills involved in controlling attention and switching between tasks. Early experiments seemed to confirm this, showing that bilingual children and adults performed better on certain tests of attention.",
  "In the last decade, however, the claim has come under sustained criticism. Several large studies, involving thousands of participants, have failed to find any consistent difference between bilinguals and monolinguals. Critics also point to publication bias: studies that found an advantage were more likely to be published than those that did not, giving a misleading impression of the evidence.",
  "None of this means that learning a second language is without value. The practical, cultural, and economic benefits of bilingualism are not in dispute. What remains uncertain is whether bilingualism produces broader cognitive gains, and many researchers now believe that if such an advantage exists at all, it is considerably smaller than was once believed."
]};
PASSAGES.t_micro = { title: "Microplastics", paras: [
  "Plastic pollution was once thought of mainly as a visible problem: bottles on beaches and bags caught in trees. Over the past two decades, however, scientists have become increasingly concerned about pieces too small to see. Microplastics, generally defined as fragments less than five millimeters long, have now been found everywhere from Arctic sea ice to the deepest ocean trenches, as well as in drinking water and table salt.",
  "These particles come from two main sources. Some are manufactured to be small, such as the beads once common in face washes and toothpastes. Many countries have banned these products, but they account for only a small share of the total. Far more microplastics are produced when larger items break down. Sunlight, waves, and friction gradually fragment plastic waste, and synthetic clothing releases tiny fibers every time it is washed.",
  "The effects on living things are not yet well understood. Laboratory studies have shown that some marine animals that swallow microplastics eat less and grow more slowly, possibly because the particles make them feel full. However, many of these experiments used concentrations far higher than those found in the open ocean, which makes their results difficult to apply to real ecosystems.",
  "For humans, the main concern is not the plastic itself, most of which passes through the body, but the chemicals that may be attached to it. Plastics can absorb pollutants from the surrounding water, and some contain additives that are known to disrupt hormones. Whether the amounts that people actually consume pose a significant risk is a question researchers are still working to answer."
]};
PASSAGES.t_default = { title: "The Power of Defaults", paras: [
  "Traditional economic theory assumes that people make decisions by carefully weighing costs and benefits. Yet a wealth of evidence suggests that choices are strongly influenced by the way options are presented. One of the most powerful examples is the default effect: the tendency of people to stay with whatever option has been selected for them in advance.",
  "The effect is striking in the case of retirement savings. When employees in some American companies had to actively sign up for a savings plan, fewer than half did so. When the same companies enrolled workers automatically, while allowing them to leave the plan at any time, participation rose to more than ninety percent. The financial incentives were identical; only the default had changed.",
  "Several explanations have been proposed. Changing a default requires effort, however small, and people tend to postpone tasks that require effort. Defaults may also be seen as implicit recommendations: if the employer has chosen this option, it is presumably sensible. Finally, giving up an option that is already “ours” can feel like a loss, and people generally dislike losses more than they value equivalent gains.",
  "Because defaults are so influential, some governments have used them deliberately to encourage behavior they consider beneficial, such as organ donation. This practice has raised ethical concerns. Supporters argue that since some default must always exist, it might as well be one that helps people. Critics respond that policies which rely on inertia rather than informed consent may undermine individual autonomy, even if people remain free to opt out."
]};

  ex:"“I’d love to, but…” = ปฏิเสธอย่างสุภาพ ข้อมูลหลังคำว่า but คือคำตอบ ตัวเลือก D เป็นกับดักเพราะมีคำว่า next week ที่ได้ยิน"},
 {id:"L2", script:[["M","Excuse me, does this bus go to the central library?"],["W","It used to, but the route changed last month. You’ll need the number 21 now."]],
  q:"What does the woman imply?", ch:["The library has moved","The man is on the wrong bus","The bus is running late","The library closed last month"], a:1, type:"Implied meaning",
  ex:"เธอไม่ได้พูดตรงๆ ว่า “ขึ้นผิดคัน” แต่ “It used to” + “You’ll need the number 21” สื่อความหมายนั้น โจทย์ imply ต้องตีความ ไม่ใช่หาคำซ้ำ"},
 {id:"L3", script:[["W","I can’t believe the assignment is due tomorrow."],["M","Actually, the professor extended the deadline to Friday. Didn’t you check your email?"]],
  q:"What do we learn from the conversation?", ch:["The assignment is due tomorrow","The woman sent the professor an email","The deadline has been moved to Friday","The man has not started the assignment"], a:2, type:"Short conversation",
  ex:"คำว่า Actually คือสัญญาณ “แก้ข้อมูล” สิ่งที่พูดหลัง Actually มักเป็นคำตอบ ตัวเลือก A คือข้อมูลที่ผู้หญิงเข้าใจผิด"},
 {id:"L4", script:[["M","How did your presentation go?"],["W","Well, the slides didn’t work at first, but once they did, everyone seemed really interested."]],
  q:"How does the woman feel about her presentation?", ch:["Disappointed because of the technical problem","Generally positive despite an early problem","Worried about the audience’s reaction","Unsure whether she should present again"], a:1, type:"Speaker’s attitude",
  ex:"มีปัญหาตอนต้น แต่ (but) จบที่ “everyone seemed really interested” ทัศนคติโดยรวมจึงเป็นบวก ระวังตัวเลือกที่จับแค่ครึ่งแรก"},
 {id:"L5", script:[["M","Good morning, everyone. Before we begin today’s lecture on renewable energy, I’d like to remind you that the lab session scheduled for Thursday has been moved to Monday because of building maintenance. Also, from now on, please submit your reading reflections online rather than on paper."]],
  q:"Why has the lab session been rescheduled?", ch:["The lecturer will be away on Thursday","The lab equipment is broken","The building needs maintenance","Students requested more time"], a:2, type:"Talk / announcement",
  ex:"ฟังคำบอกเหตุผล “because of …” ในประกาศ ข้อมูลมาเร็วและมาครั้งเดียว ควรอ่านตัวเลือกล่วงหน้าว่าต้องฟังหาอะไร"},
 {id:"L6", script:[["M","Good morning, everyone. Before we begin today’s lecture on renewable energy, I’d like to remind you that the lab session scheduled for Thursday has been moved to Monday because of building maintenance. Also, from now on, please submit your reading reflections online rather than on paper."]],
  q:"How should students hand in their reading reflections?", ch:["On paper in class","Online","At the lab session","By email to the lecturer"], a:1, type:"Talk / announcement",
  ex:"“online rather than on paper” = ส่งออนไลน์ ระวัง A ซึ่งมีคำว่า paper ที่ได้ยิน แต่เป็นสิ่งที่ “ไม่ให้” ทำ"},
 {id:"L7", script:[["M","Should we take a taxi to the airport?"],["W","At this hour? The train would be much faster, and it’s half the price."]],
  q:"What does the woman suggest?", ch:["Leaving for the airport later","Taking the train instead","Sharing a taxi","Checking the train schedule"], a:1, type:"Suggestion",
  ex:"ตอบคำถามด้วยคำถาม “At this hour?” = ไม่เห็นด้วย แล้วเสนอทางเลือกที่ดีกว่า (train)"},
 {id:"L8", script:[["W","Did you finish reading that novel I lent you?"],["M","I could hardly put it down."]],
  q:"What does the man mean?", ch:["He found the novel difficult","He hasn’t started the novel","He enjoyed the novel very much","He wants to return the novel"], a:2, type:"Idiom",
  ex:"“couldn’t / could hardly put it down” = วางไม่ลง สนุกมาก คำว่า hardly ทำให้หลายคนคิดว่าเป็นความหมายลบ นี่คือกับดักสำนวนที่เจอบ่อย"}
 ,{id:"T101", set:"T1", part:21, script:[["W","I thought you were going to present the findings at the symposium."],["M","So did I, but Dr. Harris decided the data needed another round of analysis."]], q:"What does the man imply?", ch:["His presentation has been put off until the data is reanalyzed.","Dr. Harris will present the findings instead.","He disagrees with the findings.","The symposium has been canceled."], a:0, type:"Short conversation · Inference",
  ex:"“So did I, but…” = ตัวเขาเองก็คิดอย่างนั้น แต่แผนเปลี่ยน เพราะต้องวิเคราะห์ข้อมูลใหม่ จึงอนุมานว่ายังไม่ได้นำเสนอ ไม่มีข้อมูลว่า Dr. Harris จะนำเสนอแทน"},
 {id:"T102", set:"T1", part:21, script:[["M","This apartment is great, but isn’t it a bit far from campus?"],["W","The bus stops right outside, and it’s half the rent of the places nearby."]], q:"What does the woman imply?", ch:["The apartment’s advantages make up for its location.","She plans to move closer to campus.","The bus service is unreliable.","She cannot afford the apartment."], a:0, type:"Short conversation · Inference",
  ex:"เธอไม่ได้ปฏิเสธว่าไกล แต่ยกข้อดีสองข้อ (รถเมล์หน้าตึก ค่าเช่าครึ่งเดียว) = ข้อดีคุ้มกับระยะทาง"},
 {id:"T103", set:"T1", part:21, script:[["W","Did you manage to get into Professor Lin’s seminar?"],["M","I was tenth on the waiting list, and only five people dropped out."]], q:"What can be inferred about the man?", ch:["He was not able to join the seminar.","He enrolled after five students dropped out.","He decided not to take the seminar.","He will be the tenth student in the seminar."], a:0, type:"Short conversation · Inference",
  ex:"ต้องคิดเลข: อยู่ลำดับที่ 10 ในรายชื่อรอ แต่มีคนถอนแค่ 5 คน จึงไม่ได้เข้าเรียน ข้อ CU-TEP มักให้ข้อมูลแล้วให้สรุปเอง"},
 {id:"T104", set:"T1", part:21, script:[["M","You look exhausted. Were you up all night working on the lab report?"],["W","If only. I spent most of the night trying to recover the file after my laptop crashed."]], q:"What does the woman mean?", ch:["She made little progress on the report itself.","She finished the report early.","Her lab partner wrote the report.","She stayed up to buy a new laptop."], a:0, type:"Short conversation · Idiom",
  ex:"“If only.” = อยากให้เป็นอย่างนั้นจัง แปลว่าไม่ได้ทำรายงานเลย เวลาหมดไปกับการกู้ไฟล์"},
 {id:"T105", set:"T1", part:21, script:[["W","Should I bring anything to the study group on Thursday?"],["M","Just your notes from the last three lectures. Kevin’s bringing snacks, as usual."]], q:"What does the man suggest the woman do?", ch:["Bring her lecture notes","Bring some snacks","Ask Kevin for his notes","Skip the next lecture"], a:0, type:"Short conversation · Detail",
  ex:"“Just your notes…” ส่วนขนมเป็นหน้าที่ของ Kevin ตัวเลือกที่ใช้คำว่า snacks จึงเป็นกับดัก"},
 {id:"T106", set:"T1", part:21, script:[["M","I can’t believe the library closes at six during exam week."],["W","Actually, that’s only on Saturdays. On weekdays it’s open until midnight."]], q:"What does the woman say about the library?", ch:["It stays open later on weekdays than the man thinks.","It closes at six every day during exams.","It is closed on Saturdays.","Its hours have recently been reduced."], a:0, type:"Short conversation · Detail",
  ex:"Actually = แก้ความเข้าใจ ปิด 6 โมงเฉพาะวันเสาร์ วันธรรมดาเปิดถึงเที่ยงคืน"},
 {id:"T107", set:"T1", part:21, script:[["W","Professor Grant’s lectures are so hard to follow."],["M","Tell me about it. I’ve started recording them so I can listen again later."]], q:"What does the man mean?", ch:["He agrees that the lectures are difficult.","He wants the woman to explain the lectures.","He thinks the lectures are easy to follow.","He has stopped attending the lectures."], a:0, type:"Short conversation · Idiom",
  ex:"“Tell me about it.” เป็นสำนวน = เห็นด้วยอย่างยิ่ง ไม่ได้ขอให้เล่า"},
 {id:"T108", set:"T1", part:21, script:[["M","Are you going to take the internship in Singapore?"],["W","I’d love to, but it would mean postponing graduation by a whole semester."]], q:"What is the woman concerned about?", ch:["The internship would delay her graduation.","The internship does not pay well.","She does not want to live abroad.","She has not been offered the internship."], a:0, type:"Short conversation · Detail",
  ex:"“I’d love to, but…” ข้อกังวลอยู่หลัง but: ต้องเลื่อนจบไปหนึ่งภาค"},
 {id:"T109", set:"T1", part:21, script:[["W","I heard the chemistry midterm was moved to next Monday."],["M","That’s what I thought too, until I checked the course website this morning."]], q:"What does the man imply?", ch:["The midterm has not been moved.","The midterm is next Monday.","The course website is not working.","He did not check the website."], a:0, type:"Short conversation · Inference",
  ex:"“That’s what I thought too, until…” = เคยคิดเหมือนกันจนได้ดูเว็บ แปลว่าข้อมูลนั้นไม่จริง"},
 {id:"T110", set:"T1", part:21, script:[["M","Could you lend me your statistics textbook for the weekend?"],["W","I would if I hadn’t already promised it to Maria."]], q:"What does the woman mean?", ch:["She cannot lend the book to the man.","She will lend the book to the man after Maria.","Maria has borrowed the man’s book.","She does not have a statistics textbook."], a:0, type:"Short conversation · Inference",
  ex:"ประโยคเงื่อนไขสมมติ “I would if I hadn’t…” = ความจริงคือสัญญาให้ Maria ไปแล้ว จึงให้ยืมไม่ได้"},
 {id:"T201", set:"T1", part:22, script:T_C1, q:"Why does the woman go to see the professor?", ch:["To discuss changing her field of study","To ask for a research position","To complain about a course","To get help with her summer project"], a:0, type:"Longer conversation",
  ex:"ประโยคแรก: thinking about switching my major จุดประสงค์ของบทสนทนามักอยู่ต้นบท"},
 {id:"T202", set:"T1", part:22, script:T_C1, q:"What did the woman learn from her summer project?", ch:["Turning scientific findings into action was the real challenge.","Water pollution was less serious than expected.","She did not enjoy laboratory work.","Local governments had already solved the problem."], a:0, type:"Longer conversation",
  ex:"“the science wasn’t the hard part. The real problem was getting local governments to act on the data.”"},
 {id:"T203", set:"T1", part:22, script:T_C1, q:"What does the professor suggest?", ch:["Adding a minor instead of changing her major","Changing her major immediately","Taking a year off","Applying to graduate school now"], a:0, type:"Longer conversation",
  ex:"“you don’t necessarily have to switch. We offer a minor…”"},
 {id:"T204", set:"T1", part:22, script:T_C1, q:"According to the professor, why would the woman be competitive for certain graduate programs?", ch:["She would combine laboratory experience with policy training.","She has published research on water pollution.","She has worked for a local government.","She has very high grades in policy courses."], a:0, type:"Longer conversation",
  ex:"“with your lab background, you’d be quite competitive for graduate programs that combine science and policy”"},
 {id:"T205", set:"T1", part:22, script:T_C1, q:"What will the professor probably do next?", ch:["Send the woman a list of courses","Change the woman’s schedule","Contact a graduate program","Discuss her project with local officials"], a:0, type:"Longer conversation",
  ex:"“I’ll email you the list.” คำถามแบบ “จะทำอะไรต่อ” คำตอบอยู่ท้ายบท"},
 {id:"T206", set:"T1", part:22, script:T_C2, q:"What is the main problem with the survey?", ch:["The respondents do not represent all students.","Too few people responded.","The questions were unclear.","The survey was sent too late."], a:0, type:"Longer conversation",
  ex:"เกือบ 90% เป็นปีหนึ่ง แต่โจทย์วิจัยเกี่ยวกับนักศึกษาทุกชั้นปี = กลุ่มตัวอย่างไม่เป็นตัวแทน ส่วนจำนวน 400 คนถือว่ามากพอ"},
 {id:"T207", set:"T1", part:22, script:T_C2, q:"Why did most of the responses come from first-year students?", ch:["The link was shared in a first-year group.","First-year students spend the most money.","Other students refused to participate.","Dr. Wong told them to survey first-year students."], a:0, type:"Longer conversation",
  ex:"“we posted the link in the first-year orientation group”"},
 {id:"T208", set:"T1", part:22, script:T_C2, q:"What does the man suggest at first?", ch:["Acknowledging the problem in the report instead of fixing it","Changing the research question","Asking Dr. Wong for an extension","Removing the first-year responses"], a:0, type:"Longer conversation",
  ex:"“Couldn’t we just add a note in the limitations section?” = บอกข้อจำกัดไว้ในรายงาน"},
 {id:"T209", set:"T1", part:22, script:T_C2, q:"What does the woman propose?", ch:["Redistributing the survey to reach other year groups","Interviewing Dr. Wong","Reducing the number of questions","Combining their data with another group’s"], a:0, type:"Longer conversation",
  ex:"ส่งแบบสอบถามใหม่ผ่านจดหมายข่าวคณะ และให้ได้อย่างน้อย 100 คนต่อชั้นปี"},
 {id:"T210", set:"T1", part:22, script:T_C2, q:"What can be inferred about the project schedule?", ch:["They will have about a week left after collecting new data.","They will miss the deadline.","The deadline is in two weeks.","They have already finished the analysis."], a:0, type:"Longer conversation · Inference",
  ex:"เก็บข้อมูลใหม่ใช้ 2 สัปดาห์ จากเวลาที่เหลือ 3 สัปดาห์ = เหลือราวหนึ่งสัปดาห์ เธอจึงบอกให้เริ่มวิเคราะห์ข้อมูลเดิมตอนนี้"},
 {id:"T301", set:"T1", part:23, script:T_T1, q:"What is the lecture mainly about?", ch:["Why a new technology took a long time to raise productivity","How electric motors were invented","The dangers of steam-powered factories","The history of artificial intelligence"], a:0, type:"Lecture",
  ex:"ประโยคแรกตั้งคำถามหลักของการบรรยาย AI ถูกพูดถึงแค่ตอนท้ายเป็นการเปรียบเทียบ"},
 {id:"T302", set:"T1", part:23, script:T_T1, q:"According to the professor, how did most factories first use electricity?", ch:["They replaced the steam engine with one large motor.","They gave every machine its own motor.","They used it only for lighting.","They redesigned their entire factory floors."], a:0, type:"Lecture",
  ex:"“most simply replaced the steam engine with one large electric motor and left everything else the same” ตัวเลือกอื่นเกิดขึ้นทีหลัง"},
 {id:"T303", set:"T1", part:23, script:T_T1, q:"What led to the eventual gains in productivity?", ch:["Reorganizing factories around the flow of work","Cheaper electricity","Longer shafts and belts","Hiring more workers"], a:0, type:"Lecture",
  ex:"ให้เครื่องจักรแต่ละเครื่องมีมอเตอร์ของตัวเอง จึงจัดผังโรงงานตามลำดับงานได้"},
 {id:"T304", set:"T1", part:23, script:T_T1, q:"Why does the professor mention the 1880s and the 1920s?", ch:["To show the delay between an invention and its economic impact","To compare two economic crises","To explain when steam engines were invented","To describe when factories moved to the United States"], a:0, type:"Lecture · Purpose",
  ex:"ข้อถามจุดประสงค์ของการยกตัวอย่าง: สองปีนี้แสดงช่องว่างราว 40 ปีระหว่างมีเทคโนโลยีกับผลิตภาพที่เพิ่มขึ้น"},
 {id:"T305", set:"T1", part:23, script:T_T1, q:"What does the professor imply about artificial intelligence?", ch:["Its benefits may require organizational change before they appear.","It has already transformed productivity.","It will never improve productivity.","It is more powerful than electricity."], a:0, type:"Lecture · Inference",
  ex:"“a similar delay” เชื่อมกับบทเรียนเรื่องไฟฟ้า: ประโยชน์มาเมื่อองค์กรปรับวิธีทำงาน"},
 {id:"T306", set:"T1", part:23, script:T_T2, q:"What is the talk mainly about?", ch:["Ways that desert plants cope with a lack of water","How deserts are formed","Why some seeds are poisonous","The use of cacti as food"], a:0, type:"Lecture",
  ex:"สองกลยุทธ์: หลีกเลี่ยงความแห้งแล้ง และทนความแห้งแล้ง"},
 {id:"T307", set:"T1", part:23, script:T_T2, q:"What is true of desert annuals?", ch:["They complete their life cycle quickly after heavy rain.","They store water in thick stems.","They grow only at night.","They germinate after every rainfall."], a:0, type:"Lecture",
  ex:"งอก ออกดอก และให้เมล็ดภายในไม่กี่สัปดาห์ก่อนดินแห้ง ตัวเลือก B เป็นของกระบองเพชร"},
 {id:"T308", set:"T1", part:23, script:T_T2, q:"Why do the seeds of some species contain chemicals?", ch:["To prevent growth when there is not enough rain","To attract animals","To protect against insects","To speed up germination"], a:0, type:"Lecture",
  ex:"สารเคมีป้องกันการงอกหลังฝนตกเล็กน้อย จะถูกชะล้างเมื่อฝนตกมากพอเท่านั้น"},
 {id:"T309", set:"T1", part:23, script:T_T2, q:"Why do cacti open their pores only at night?", ch:["To reduce water loss","To absorb more sunlight","To release seeds","To avoid animals"], a:0, type:"Lecture",
  ex:"“when cooler temperatures mean less water is lost”"},
 {id:"T310", set:"T1", part:23, script:T_T2, q:"What will the class discuss next week?", ch:["How these adaptations might help agriculture","Desert animals","Climate change in deserts","How to grow cacti at home"], a:0, type:"Lecture",
  ex:"ท้ายบรรยายบอกหัวข้อสัปดาห์หน้า: นักวิทยาศาสตร์การเกษตรศึกษาเพื่อพัฒนาพืชทนแล้ง"}

],

 {id:"R2", p:"heat", q:"According to the passage, when is the temperature difference between cities and the countryside usually largest?", ch:["At midday","In the early morning","After the sun goes down","During the rainy season"], a:2, type:"Detail",
  ex:"ย่อหน้า 1: “greatest after sunset rather than at midday” ตัวเลือก C คือการถอดความ (paraphrase) ของ after sunset"},
 {id:"R3", p:"heat", q:"The word “poses” in paragraph 2 is closest in meaning to…", ch:["presents","reduces","imitates","questions"], a:0, type:"Vocabulary in context",
  ex:"ลองแทนคำ: Heat also presents serious health risks อ่านแล้วความหมายเดิม pose a risk = ก่อให้เกิดความเสี่ยง"},
 {id:"R4", p:"heat", q:"The word “their” in paragraph 3 refers to…", ch:["city planners","trees","these measures","critics"], a:2, type:"Reference",
  ex:"“these measures require long-term investment, and their benefits…” ย้อนไปหาคำนามพหูพจน์ที่ใกล้และเข้าความหมาย ประโยชน์ของ “มาตรการเหล่านี้”"},
 {id:"R5", p:"heat", q:"It can be inferred that the critics mentioned in paragraph 3 would most likely support…", ch:["removing parks to build more housing","stricter rules for new construction","stopping the use of reflective paint","moving people out of cities"], a:1, type:"Inference",

 {id:"R6", p:"recall", q:"Which of the following is the best title for the passage?", ch:["The History of Highlighting","Why Testing Yourself Helps You Remember","How to Write Better Notes","The Dangers of Exams"], a:1, type:"Main idea / title",
  ex:"ทั้งเรื่องพูดถึง retrieval practice (การทดสอบตัวเอง) ว่าช่วยความจำ ตัวเลือก A, C แคบไป D ผิดทิศทาง"},
 {id:"R7", p:"recall", q:"According to paragraph 2, which group did better on the test taken a few minutes after studying?", ch:["The group that took a short test","The group that reread the passage","Both groups performed equally","Neither group was tested at that time"], a:1, type:"Detail",
  ex:"“When tested a few minutes later, the rereading group performed slightly better.” ระวังสับสนกับผลหลังหนึ่งสัปดาห์ซึ่งกลับกัน"},
 {id:"R8", p:"recall", q:"The word “fades” in paragraph 3 is closest in meaning to…", ch:["grows stronger","gradually disappears","becomes confusing","is written down"], a:1, type:"Vocabulary in context",
  ex:"บริบท: สิ่งที่เรียนแบบอัดก่อนสอบ “fades quickly” ตรงข้ามกับ “last” ในประโยคท้าย = ค่อยๆ หายไป"},
 {id:"R9", p:"recall", q:"The word “it” in “allow it to be found again” refers to…", ch:["the effort","information","the pattern","the passage"], a:1, type:"Reference",

  ex:"ภาพมีคนยืนชี้ไปที่กราฟบนจอ ตัวเลือก C พูดถึงผู้ฟังซึ่งไม่มีในภาพ ข้อ Photographs ให้ตัดตัวเลือกที่พูดถึงสิ่งที่มองไม่เห็นทิ้งก่อน"},
 {id:"C102", part:1, img:"water", ch:["The woman is opening the window.","The plants are being sold.","The woman is watering some plants.","The woman is planting a tree."], a:2, type:"Part I Photographs",
  ex:"เธอกำลังรดน้ำต้นไม้ ตัวเลือก D ใช้คำเสียงคล้าย (planting / plants) และ A มีหน้าต่างที่เห็นในภาพแต่การกระทำไม่ตรง กับดักแบบนี้เจอบ่อยมาก"},
 {id:"C103", part:1, img:"shake", ch:["They are signing a contract.","They are holding a meeting outside.","They are passing a document.","They are shaking hands."], a:3, type:"Part I Photographs",
  ex:"มีเอกสารบนโต๊ะ แต่สิ่งที่ทั้งสองคน “กำลังทำ” คือจับมือ ตัวเลือก A และ C ใช้สิ่งของในภาพมาหลอก ให้ดูที่การกระทำหลัก"},
 {id:"C104", part:1, img:"cart", ch:["Some boxes have been stacked on a cart.","A man is carrying a box.","The boxes are being opened.","The door is locked."], a:0, type:"Part I Photographs",
  ex:"ภาพไม่มีคน ตัวเลือกที่พูดถึงคนกำลังทำอะไร (B) หรือ “are being + V3” ซึ่งแปลว่ามีคนกำลังทำอยู่ (C) จึงผิด ภาพสิ่งของมักใช้ “has/have been + V3” ส่วน D ดูจากภาพไม่ได้"},
 {id:"C201", part:2, script:[["M","When is the quarterly report due?"]], ch:["It’s on the third floor.","Yes, I reported it.","By the end of next week.","Quarterly, I think."], a:2, type:"Part II Question–Response",
  ex:"When ต้องตอบเรื่องเวลา B และ D ใช้คำเสียงคล้าย (reported, quarterly) เป็นกับดัก"},
 {id:"C202", part:2, script:[["W","Would you like me to book the meeting room for Friday?"]], ch:["That would be great, thanks.","It’s a very good book.","I met him on Friday.","The room is quite large."], a:0, type:"Part II Question–Response",
  ex:"Would you like me to…? คือการเสนอความช่วยเหลือ ตอบรับหรือปฏิเสธอย่างสุภาพ B ใช้ book ความหมายหนังสือ เป็นกับดักคำพ้อง"},
 {id:"C203", part:2, script:[["M","Why didn’t the shipment arrive this morning?"]], ch:["It arrived at nine.","By express mail.","There was a problem at the warehouse.","Yes, it’s a large ship."], a:2, type:"Part II Question–Response",
  ex:"Why ต้องการเหตุผล คำตอบไม่จำเป็นต้องขึ้นด้วย Because ตัวเลือก A ขัดกับคำถาม"},
 {id:"C204", part:2, script:[["W","Who is in charge of the new project?"]], ch:["Yes, I’ll charge my phone.","Ms. Lee from the design team.","It’s a new product.","Next Monday."], a:1, type:"Part II Question–Response",
  ex:"Who ต้องตอบเป็นคนหรือตำแหน่ง คำถาม Wh- ตอบด้วย Yes ไม่ได้ และ A ใช้ charge คนละความหมาย"},
 {id:"C205", part:2, script:[["M","Where should I put these files?"]], ch:["I filed them yesterday.","They’re quite heavy.","Put on your jacket.","On the shelf next to the printer."], a:3, type:"Part II Question–Response",
  ex:"Where ต้องตอบสถานที่ A และ C เล่นเสียงคำ (files / filed, put / put on)"},
 {id:"C206", part:2, script:[["W","Don’t you think we should hire more staff?"]], ch:["Higher than last year.","I’m not sure the budget allows it.","The staff room is upstairs.","Yes, he was hired."], a:1, type:"Part II Question–Response",
  ex:"คำถามขอความเห็น คำตอบอ้อมที่แสดงความลังเลก็ถูกได้ A ใช้ higher เสียงคล้าย hire"},
 {id:"C301", part:3, script:CONV, q:"What will the woman do after lunch?", ch:["Call the client","Attend a training session","Send a new meeting invitation","Join the video call"], a:2, type:"Part III Short Conversations",
  ex:"ผู้ชายขอ “Could you send them a new invitation?” ผู้หญิงตอบ “Sure, I’ll do it right after lunch.” คำถาม “จะทำอะไรต่อ” คำตอบมักอยู่ท้ายบทสนทนา"},
 {id:"C302", part:3, script:CONV, q:"Why does the man need to change his plans?", ch:["His training session is on Thursday afternoon","The client cancelled the call","He will be away on Tuesday","He has not written the invitation"], a:0, type:"Part III Short Conversations",
  ex:"เขาบอกว่า Thursday ได้ แต่ (but) ต้องเลื่อน training แปลว่าชนกับเวลาใหม่"},
 {id:"C303", part:3, script:CONV, q:"When will the video call most likely take place?", ch:["Tuesday morning","Tuesday afternoon","Thursday morning","Thursday afternoon"], a:3, type:"Part III Short Conversations",
  ex:"ลูกค้าขอเลื่อนจากอังคารเป็นพฤหัสบ่าย และผู้ชายตกลง ระวัง Tuesday ซึ่งเป็นเวลาเดิม"},
 {id:"C304", part:3, script:CONV2, q:"Where does the man most likely work?", ch:["At an airline","At a hotel","At a travel agency","At an airport"], a:1, type:"Part III Short Conversations",
  ex:"ประโยคแรก “Good afternoon, Bayview Hotel.” สถานที่ทำงานมักบอกในประโยคแรกๆ คำว่า flight เป็นกับดักให้เลือก A หรือ D"},
 {id:"C305", part:3, script:CONV2, q:"Why is the woman calling?", ch:["To cancel her reservation","To change her check-in date","To book a flight","To ask about the room price"], a:1, type:"Part III Short Conversations",
  ex:"เที่ยวบินเลื่อนหนึ่งวัน จึงขอเช็กอินวันที่ 13 แทน 12"},
 {id:"C306", part:3, script:CONV2, q:"When will the woman most likely check out?", ch:["On the 13th","On the 14th","On the 15th","On the 16th"], a:3, type:"Part III Short Conversations",
  ex:"ต้องคำนวณ: เช็กอินวันที่ 13 และขอพักครบสามคืน → ออกวันที่ 16 ตัวเลือก C คือวันออกเดิม ข้อแบบนี้ต้องฟังให้ครบทุกตัวเลข"},
 {id:"C401", part:4, script:VOICE, q:"Where does the speaker work?", ch:["At a delivery company","At a printing company","At a phone company","At an advertising agency"], a:1, type:"Part IV Short Talks",
  ex:"“This is Lisa from Greenway Printing.” ข้อความเสียงมักบอกชื่อและที่ทำงานตั้งแต่ต้น"},
 {id:"C402", part:4, script:VOICE, q:"Why is the speaker calling?", ch:["To cancel an order","To check a possible mistake","To ask for payment","To offer a discount"], a:1, type:"Part IV Short Talks",
  ex:"จุดประสงค์อยู่หลัง but: เบอร์โทรอาจผิด จึงต้องเช็กก่อนส่งของ"},
 {id:"C403", part:4, script:VOICE, q:"What does the speaker ask Mr. Chen to do?", ch:["Pick up the brochures","Change his phone number","Return her call","Pay for delivery"], a:2, type:"Part IV Short Talks",
  ex:"สิ่งที่ “ขอ” ให้ทำมักอยู่ท้ายข้อความ: Please call us back. B มีคำว่า phone number แต่ไม่ใช่สิ่งที่ขอ"},
 {id:"C404", part:4, script:ANN, q:"Where is the announcement most likely being made?", ch:["On a train","At an airport","In a hotel lobby","At a bus station"], a:1, type:"Part IV Short Talks",
  ex:"คำบอกสถานที่: passengers, flight, aircraft, Gate 12"},
 {id:"C405", part:4, script:ANN, q:"What caused the delay?", ch:["Bad weather","A technical problem","The aircraft arrived late","A shortage of staff"], a:2, type:"Part IV Short Talks",
  ex:"“Because of the late arrival of the aircraft” ตัวเลือก C คือการถอดความ ระวังเดาจากความรู้รอบตัว (A, B)"},
 {id:"C406", part:4, script:ANN, q:"What are passengers offered?", ch:["A seat upgrade","A meal voucher","A hotel room","A refund"], a:1, type:"Part IV Short Talks",
  ex:"ประกาศมักมีโครง ปัญหา → สาเหตุ → สิ่งที่ผู้ฟังได้รับหรือต้องทำ ซึ่งมักอยู่ท้าย"}
 ,{id:"C105", part:1, img:"laptop", ch:["She is drinking from a cup.","She is working on a laptop.","She is closing the curtains.","She is standing in line."], a:1, type:"Part I Photographs",
  ex:"ผู้หญิงนั่งพิมพ์งานบนแล็ปท็อป มีแก้วอยู่บนโต๊ะแต่เธอไม่ได้กำลังดื่ม (A) ระวังตัวเลือกที่ใช้สิ่งของในภาพแต่การกระทำไม่ตรง"},
 {id:"C207", part:2, script:[["W","How often does the shuttle bus run?"]], ch:["It runs very fast.","At the main entrance.","Every fifteen minutes.","I often take a taxi."], a:2, type:"Part II Question–Response",
  ex:"How often ถามความถี่ ตอบ Every… A ใช้ runs คนละความหมาย D ใช้ often ซ้ำจากคำถาม"},
 {id:"C208", part:2, script:[["M","Could you help me move this desk?"]], ch:["Sure, where do you want it?","I moved here last year.","It’s a nice desk.","No, it doesn’t help."], a:0, type:"Part II Question–Response",
  ex:"Could you…? เป็นการขอร้อง ตอบรับแล้วถามต่อได้ B และ D เล่นคำ move / help"},
 {id:"C209", part:2, script:[["W","Which printer should I use?"]], ch:["About fifty pages.","The one by the window is working.","I printed it already.","Yes, you should."], a:1, type:"Part II Question–Response",
  ex:"Which ให้เลือกสิ่งใดสิ่งหนึ่ง “The one…” เป็นคำตอบแบบมาตรฐาน คำถาม Wh- ตอบ Yes ไม่ได้"},
 {id:"C210", part:2, script:[["M","The client meeting has been moved to three o’clock."]], ch:["Three clients, I think.","In the meeting room.","It was a moving speech.","Thanks for letting me know."], a:3, type:"Part II Question–Response",
  ex:"โจทย์เป็นประโยคบอกเล่า ไม่ใช่คำถาม คำตอบที่เหมาะคือการรับทราบ ตัวเลือกอื่นใช้คำซ้ำ (three, meeting, moving)"},
 {id:"C211", part:2, script:[["W","Have you finished the budget report yet?"]], ch:["It’s within budget.","I’m still waiting for the sales figures.","Next to the finance office.","I’ll report to him."], a:1, type:"Part II Question–Response",
  ex:"ไม่ได้ตอบ No ตรงๆ แต่บอกเหตุผลว่ายังไม่เสร็จ คำตอบอ้อมแบบนี้ถูกบ่อยใน Part II"},
 {id:"C212", part:2, script:[["M","Would you prefer tea or coffee?"]], ch:["Yes, please.","Coffee, if it’s no trouble.","It’s free of charge.","I prefer to walk."], a:1, type:"Part II Question–Response",
  ex:"คำถามแบบ A or B ต้องเลือกอย่างใดอย่างหนึ่ง ตอบ Yes ไม่ได้ D ใช้ prefer ซ้ำ"},
 {id:"C213", part:2, script:[["W","Isn’t the conference in Singapore this year?"]], ch:["It was a long conference call.","Every year in May.","No, it’s been moved to Kuala Lumpur.","Yes, I’d love to sing."], a:2, type:"Part II Question–Response",
  ex:"คำถามปฏิเสธ (Isn’t…?) ใช้ตรวจสอบข้อมูล ตอบ No แล้วแก้ข้อมูลได้ D เล่นเสียง Singapore / sing"},
 {id:"C214", part:2, script:[["M","Why don’t we order lunch from the new Thai restaurant?"]], ch:["Because it’s too far.","In alphabetical order.","I had lunch at noon.","That sounds like a great idea."], a:3, type:"Part II Question–Response",
  ex:"Why don’t we…? คือการชวน ไม่ได้ถามเหตุผล ตัวเลือกที่ขึ้นด้วย Because จึงเป็นกับดัก"},
 {id:"C215", part:2, script:[["W","Who should I contact about my parking permit?"]], ch:["The security office handles that.","It’s permitted on weekends.","Park near the gate.","Yes, contact me."], a:0, type:"Part II Question–Response",
  ex:"Who อาจตอบเป็นแผนกได้ ไม่จำเป็นต้องเป็นชื่อคน B และ C เล่นเสียง permit / park"},
 {id:"C307", part:3, script:CONV3, q:"What is the problem?", ch:["The chairs were damaged","The order has been delayed","The wrong chairs were sent","The price has increased"], a:1, type:"Part III Short Conversations",
  ex:"ของควรมาถึงเมื่อวานแต่ยังไม่มา และจะพร้อมวันพุธหน้า = ส่งล่าช้า"},
 {id:"C308", part:3, script:CONV3, q:"What does the man offer?", ch:["A full refund","A discount on the next order","Free delivery","Different chairs"], a:2, type:"Part III Short Conversations",
  ex:"“We can offer you free delivery to make up for it.” ฟังคำว่า offer หรือ we can…"},
 {id:"C309", part:3, script:CONV3, q:"What does the woman ask the man to do?", ch:["Send her a catalog","Call her before the delivery","Cancel the order","Visit her office"], a:1, type:"Part III Short Conversations",
  ex:"“please call me the day before you deliver them” คำขอมักอยู่ท้ายบทสนทนา"},
 {id:"C310", part:3, script:CONV4, q:"Why will the man be away on Friday?", ch:["He is going on a business trip","He is attending a family event","He is feeling sick","He is moving to a new home"], a:1, type:"Part III Short Conversations",
  ex:"ไปงานแต่งพี่สาว (sister’s wedding) = งานของครอบครัว คำตอบเป็นการถอดความแบบกว้างขึ้น"},
 {id:"C311", part:3, script:CONV4, q:"What does the woman agree to do?", ch:["Lead a meeting","Prepare a price list","Attend a wedding","Work on Monday"], a:0, type:"Part III Short Conversations",
  ex:"ผู้ชายขอให้ cover the morning sales meeting และเธอตอบ I’d be happy to = จะดำเนินการประชุมแทน"},
 {id:"C312", part:3, script:CONV4, q:"What will happen on Monday?", ch:["The sales figures will be shared","A new employee will start","The sales meeting will be held","New prices will take effect"], a:3, type:"Part III Short Conversations",
  ex:"“the new price list starts on Monday” = ราคาใหม่เริ่มใช้ การประชุมคือวันศุกร์ ไม่ใช่จันทร์"},
 {id:"C313", part:3, script:CONV5, q:"Who is the woman?", ch:["A security guard","A phone salesperson","An IT support worker","The man’s manager"], a:2, type:"Part III Short Conversations",
  ex:"“this is the IT help desk” ตัวตนผู้พูดมักบอกในประโยคแรก A ใช้ security จาก security policy มาหลอก"},
 {id:"C314", part:3, script:CONV5, q:"Why can’t the man log in?", ch:["His password has expired","He forgot his password","He typed the wrong address","The system is being repaired"], a:0, type:"Part III Short Conversations",
  ex:"“All passwords expired at midnight” ผู้ชายยืนยันว่าไม่ได้เปลี่ยนรหัส จึงไม่ใช่การลืม"},
 {id:"C315", part:3, script:CONV5, q:"What must the man do within 24 hours?", ch:["Call the help desk again","Buy a new phone","Create a new password","Attend a security meeting"], a:2, type:"Part III Short Conversations",
  ex:"“you’ll need to create a new one within 24 hours” one แทน password"},
 {id:"C407", part:4, script:TALK3, q:"Who most likely is the speaker?", ch:["A museum tour guide","A scientist","A shop assistant","A ticket inspector"], a:0, type:"Part IV Short Talks",
  ex:"ต้อนรับเข้าพิพิธภัณฑ์และอธิบายเส้นทางทัวร์ = ไกด์"},
 {id:"C408", part:4, script:TALK3, q:"What are listeners asked not to do?", ch:["Eat in the gallery","Use a flash when taking photos","Touch the robots","Leave the group"], a:1, type:"Part IV Short Talks",
  ex:"“photography is allowed, but flash is not permitted” ฟังคำหลัง but และคำว่า not permitted"},
 {id:"C409", part:4, script:TALK3, q:"How can listeners try the virtual reality ride?", ch:["By booking online","By asking the guide","By buying another ticket","By visiting the second floor"], a:2, type:"Part IV Short Talks",
  ex:"“you’ll need to buy a separate ticket at the gift shop” separate = another"},
 {id:"C410", part:4, script:TALK4, q:"What is the news report mainly about?", ch:["Rising car prices","A port expansion","A new chief executive","A company’s plan to open a factory"], a:3, type:"Part IV Short Talks",
  ex:"ใจความหลักอยู่ในประโยคแรก: Siam Electronics will open a new factory ส่วนท่าเรือและ CEO เป็นรายละเอียด"},
 {id:"C411", part:4, script:TALK4, q:"What will the factory produce?", ch:["Electric cars","Car batteries","Computers","Ships"], a:1, type:"Part IV Short Talks",
  ex:"“produce batteries for electric cars” ตัวเลือก A เป็นกับดักเพราะได้ยิน electric cars"},
 {id:"C412", part:4, script:TALK4, q:"Why was the location chosen?", ch:["Land is cheap there","It has a port and skilled workers nearby","The government requested it","The chief executive lives there"], a:1, type:"Part IV Short Talks",
  ex:"“because of its access to the port and skilled workers in the area” ตัวเลือกอื่นไม่ได้กล่าวถึง"},
 {id:"C413", part:4, script:TALK5, q:"What is the talk mainly about?", ch:["A new system for recording working hours","A staff party","Changes to salaries","A new HR manager"], a:0, type:"Part IV Short Talks",
  ex:"ข่าวหลักคือการใช้ระบบออนไลน์บันทึกเวลาทำงาน การอบรมเป็นเรื่องรอง"},
 {id:"C414", part:4, script:TALK5, q:"What will no longer be accepted?", ch:["Late arrivals","Online forms","Paper time sheets","Overtime requests"], a:2, type:"Part IV Short Talks",
  ex:"“Paper time sheets will no longer be accepted.” B ตรงข้ามกับที่พูด"},
 {id:"C415", part:4, script:TALK5, q:"What are listeners asked to do?", ch:["Fill in a survey","Attend a training session","Call the HR department","Submit time sheets by Thursday"], a:1, type:"Part IV Short Talks",
  ex:"“Attendance is required, so please clear your schedules.” = ต้องเข้าอบรมวันพฤหัส"}
